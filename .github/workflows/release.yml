# Release of Gen4 Studio, Windows side (spec release-ci 5): builds the NSIS installer from the
# hermetic sources (no ROM, no save game) and uploads it to the draft release that
# scripts/release-local.sh made on the maintainer's Mac. The macOS DMG, its checks, the tag, the
# release notes and the draft itself come from that script: no macOS runner (macOS minutes count
# ten times; the whole release ran about $1.80 on hosted runners, the Windows part alone about
# $0.70 cold).
#
# Updater packages (release 1.0.1, docs/release.md "Update-Pakete"): the installer is also the
# Windows update package. The Bundle step signs it with the secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (read only there, and by nothing that builds third-party code
# from Git: the tools are prepared in the step before; this workflow never runs for a pull
# request) and so writes <installer>.sig. publish-windows takes the .sig of the macOS update
# package from the draft, writes latest.json (scripts/release/updater-manifest.sh) and checks it,
# and only then uploads installer, .sig and SHA256SUMS.txt, with latest.json last.
#
# Manual only (workflow_dispatch), never on a tag push:
#   gh workflow run release.yml -f tag=v0.1.0 -f dry_run=false   build, check, upload to the draft
#   gh workflow run release.yml -f tag=v0.1.0                    dry run: build and check only
# The jobs check out the tag (`version` checks the version against it); only publish-windows
# runs the scripts of the ref the workflow was started from. Caches belong to that ref (by
# default main), so every run reads what the run before saved.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag des Releases (v<Fassung>); der Entwurf dazu kommt von scripts/release-local.sh'
        type: string
        required: true
      dry_run:
        description: 'Probelauf: Installer bauen und pruefen, nichts hochladen'
        type: boolean
        default: true

# One run per tag at a time; a second start waits instead of cancelling the first (minutes).
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Smaller caches and no incremental state in target/.
  CARGO_INCREMENTAL: '0'

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Version
        id: v
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "Tag $TAG: erwartet v<Fassung>, etwa v0.1.0 oder v0.1.0-rc.1" >&2; exit 1 ;;
          esac
          bash scripts/version.sh check "$TAG"
          {
            echo "version=$(bash scripts/version.sh)"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

  bundle-windows:
    name: bundle-windows
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Tool versions
        run: grep -E '^[A-Z0-9_]+=' scripts/tool-versions.env >> "$GITHUB_ENV"

      # uxie builds nitroarc with `make ffi` and MinGW gcc (CC=gcc) into nitroarc_ffi.dll.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc make

      # Same PATH order as ci.yml (the runner puts the last GITHUB_PATH line first): Git bin,
      # mingw64, MSYS2 usr, the original PATH.
      - name: MSYS2 on PATH
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          echo "$MSYS2_LOCATION\\usr\\bin" >> "$GITHUB_PATH"
          echo "$MSYS2_LOCATION\\mingw64\\bin" >> "$GITHUB_PATH"
          echo 'C:\Program Files\Git\bin' >> "$GITHUB_PATH"

      # check-no-rom-data.sh calls `python3`. If the runner has none that works (no python3.exe,
      # or the Microsoft Store stub), a small `python3` wrapper around `python` goes first in PATH.
      - name: python3
        run: |
          if python3 -I -c 'import sys' 2>/dev/null; then
            echo "python3: $(command -v python3)"
            exit 0
          fi
          python -I -c 'import sys' || { echo "Kein funktionierendes Python auf dem Runner" >&2; exit 1; }
          shim="$(cygpath -u "$RUNNER_TEMP")/pyshim"
          mkdir -p "$shim"
          printf '#!/bin/sh\nexec python "$@"\n' > "$shim/python3"
          chmod +x "$shim/python3"
          cygpath -w "$shim" >> "$GITHUB_PATH"
          echo "python3: wrapper in $shim"

      - name: Rust toolchain
        id: rust
        run: |
          rustup toolchain install
          rustup show
          echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          echo "lockhash=${{ hashFiles('Cargo.lock') }}" >> "$GITHUB_OUTPUT"

      # Restore here, save at the end of the job: under the exact key only after a green run,
      # after a failure under `<key>-partial-<run id>`, which the restore key still finds (see
      # ci.yml). The bundle folder and target/tmp stay out; actions/cache archives a matched
      # folder whole, so the exclusions work only below the wildcards. The key names the msvc
      # target like ci.yml; the hash of Cargo.lock is taken once, in the step above.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/*
            !target/tmp
            !target/release
            target/release/*
            !target/release/bundle
          key: release-cargo-${{ runner.os }}-msvc-${{ steps.rust.outputs.version }}-${{ steps.rust.outputs.lockhash }}
          restore-keys: |
            release-cargo-${{ runner.os }}-msvc-${{ steps.rust.outputs.version }}-

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tools-cache
        with:
          path: tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/tool-versions.env') }}

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/studio/pnpm-lock.yaml

      - name: pnpm install
        working-directory: apps/studio
        run: pnpm install --frozen-lockfile

      # apicula, rotom-lsp and nitroarc, without the signing secrets: on a tools-cache miss this
      # builds code from Git (`cargo install`), which must never run with the key in its
      # environment. The Bundle step skips the preparation (G4_BUNDLE_SKIP_PREPARE).
      - name: Prepare bundle
        run: bash apps/studio/scripts/prepare-bundle.sh

      # The only step that reads the signing secrets. --config adds createUpdaterArtifacts: Tauri
      # signs the installer and writes <installer>.sig next to it.
      - name: Bundle (nsis)
        working-directory: apps/studio
        env:
          G4_BUNDLE_SKIP_PREPARE: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "Secret TAURI_SIGNING_PRIVATE_KEY fehlt (docs/release.md)" >&2; exit 1; }
          pnpm bundle -- --bundles nsis --config src-tauri/tauri.updater.conf.json

      - name: Installer
        id: setup
        run: |
          setup=""
          for f in target/release/bundle/nsis/*-setup.exe; do
            [ -s "$f" ] && setup="$f"
          done
          [ -n "$setup" ] || { echo "Kein *-setup.exe in target/release/bundle/nsis" >&2; exit 1; }
          [ -s "$setup.sig" ] || { echo "Keine Signatur $setup.sig (createUpdaterArtifacts, Secret TAURI_SIGNING_PRIVATE_KEY)" >&2; exit 1; }
          echo "path=$setup" >> "$GITHUB_OUTPUT"
          echo "sig=$setup.sig" >> "$GITHUB_OUTPUT"
          echo "installer: $setup (mit .sig)"

      # Installs silently to $RUNNER_TEMP/g4s, checks the files and runs `studio.exe doctor`.
      - name: check-bundle-windows
        env:
          SETUP: ${{ steps.setup.outputs.path }}
        run: bash apps/studio/scripts/check-bundle-windows.sh "$SETUP"

      # The folder check-bundle-windows.sh installed to (it only uses another one when
      # $RUNNER_TEMP has a space, which never fails to show here).
      - name: Install folder
        id: install
        run: |
          dir="$(cygpath -u "$RUNNER_TEMP")/g4s"
          [ -s "$dir/studio.exe" ] || { echo "studio.exe fehlt in $dir (check-bundle-windows.sh hat woanders installiert?)" >&2; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: no rom data
        env:
          INSTALL_DIR: ${{ steps.install.outputs.dir }}
          SETUP: ${{ steps.setup.outputs.path }}
        run: bash scripts/check-no-rom-data.sh "$INSTALL_DIR" "$SETUP"

      - name: Synthetic project
        run: >-
          cargo run -p g4-kernel --example make_synthetic --features test-support --
          "$(cygpath -m "$RUNNER_TEMP")/syn"

      - name: smoke
        env:
          INSTALL_DIR: ${{ steps.install.outputs.dir }}
        run: bash scripts/smoke-packaged.sh "$INSTALL_DIR/studio.exe" "$(cygpath -m "$RUNNER_TEMP")/syn"

      - name: Name the installer
        env:
          SETUP: ${{ steps.setup.outputs.path }}
          SETUP_SIG: ${{ steps.setup.outputs.sig }}
        run: |
          mkdir -p dist-release
          cp "$SETUP" "dist-release/Gen4-Studio_${VERSION}_x64-setup.exe"
          cp "$SETUP_SIG" "dist-release/Gen4-Studio_${VERSION}_x64-setup.exe.sig"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-nsis
          path: |
            dist-release/Gen4-Studio_${{ env.VERSION }}_x64-setup.exe
            dist-release/Gen4-Studio_${{ env.VERSION }}_x64-setup.exe.sig
          retention-days: 7
          if-no-files-found: error

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/*
            !target/tmp
            !target/release
            target/release/*
            !target/release/bundle
          key: release-cargo-${{ runner.os }}-msvc-${{ steps.rust.outputs.version }}-${{ steps.rust.outputs.lockhash }}

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: failure() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/*
            !target/tmp
            !target/release
            target/release/*
            !target/release/bundle
          key: release-cargo-${{ runner.os }}-msvc-${{ steps.rust.outputs.version }}-${{ steps.rust.outputs.lockhash }}-partial-${{ github.run_id }}

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && steps.tools-cache.outputs.cache-hit != 'true' && hashFiles('tools/apicula/bin/apicula.exe') != '' && hashFiles('tools/rotom/bin/rotom-lsp.exe') != '' }}
        with:
          path: tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/tool-versions.env') }}

  # Not on a dry run. First latest.json is built and checked from the .sig of both update
  # packages (the macOS one from the draft, the installer's from the bundle job): a missing or
  # already published release, a draft without the macOS .sig (release-local.sh without the key),
  # a signature of another key or a version that does not match stop the job here, before
  # anything is uploaded. Only then the installer goes to the draft of the tag (made by
  # release-local.sh), its line to the draft's SHA256SUMS.txt, then its .sig, and latest.json
  # last: `latest` points at the release only once it is published, and a draft never has a new
  # installer next to an old latest.json.
  publish-windows:
    name: publish-windows
    needs: [version, bundle-windows]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The scripts of the ref the workflow runs from (add-checksum.sh), not of the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-nsis
          path: release

      - name: Draft
        run: |
          if ! draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"; then
            echo "Kein Release zum Tag $TAG: zuerst auf dem Mac bash scripts/release-local.sh $TAG (legt den Entwurf an)" >&2
            exit 1
          fi
          if [ "$draft" != true ]; then
            echo "Der Release $TAG ist kein Entwurf mehr (schon veroeffentlicht): der Installer wird nicht nachgeladen" >&2
            exit 1
          fi
          echo "Entwurf $TAG gefunden"

      # latest.json: version, notes (the body of the draft) and both signatures. The macOS .sig
      # comes from the draft; without it (or with a broken one, see updater-manifest.sh) the job
      # fails here, before anything is uploaded. Nothing is uploaded by this step.
      - name: Update manifest
        run: |
          mac="Gen4-Studio_${VERSION}_aarch64.app.tar.gz.sig"
          win="release/Gen4-Studio_${VERSION}_x64-setup.exe.sig"
          [ -s "$win" ] || { echo "Datei fehlt: $win" >&2; ls -l release >&2; exit 1; }
          mkdir -p mac
          gh release download "$TAG" --pattern "$mac" --dir mac || true
          [ -s "mac/$mac" ] || {
            echo "Der Entwurf $TAG hat kein macOS-Update-Paket (release-local.sh mit Schluessel)" >&2
            exit 1
          }
          gh release view "$TAG" --json body --jq .body > notes.md
          bash scripts/release/updater-manifest.sh "$TAG" notes.md "mac/$mac" "$win" latest.json
          cat latest.json

      # SHA256SUMS.txt of the draft first: without it nothing is uploaded.
      - name: Upload installer and checksums
        run: |
          exe="release/Gen4-Studio_${VERSION}_x64-setup.exe"
          [ -s "$exe" ] || { echo "Datei fehlt: $exe" >&2; ls -l release >&2; exit 1; }
          mkdir -p sums
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir sums || {
            echo "Der Entwurf $TAG hat keine SHA256SUMS.txt (release-local.sh laedt sie mit dem DMG hoch)" >&2
            exit 1
          }
          bash scripts/release/add-checksum.sh sums/SHA256SUMS.txt "$exe"
          cat sums/SHA256SUMS.txt
          gh release upload "$TAG" "$exe" --clobber
          gh release upload "$TAG" sums/SHA256SUMS.txt --clobber

      - name: Upload installer signature
        run: |
          sig="release/Gen4-Studio_${VERSION}_x64-setup.exe.sig"
          [ -s "$sig" ] || { echo "Datei fehlt: $sig" >&2; ls -l release >&2; exit 1; }
          gh release upload "$TAG" "$sig" --clobber

      # Last: the manifest that was built and checked above.
      - name: Upload latest.json
        run: |
          [ -s latest.json ] || { echo "latest.json fehlt" >&2; exit 1; }
          gh release upload "$TAG" latest.json --clobber
