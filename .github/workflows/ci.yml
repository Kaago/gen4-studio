# CI of Gen4 Studio (spec release-ci 3.2). gate-macos runs only the hermetic part of
# scripts/gate.sh (G4_GATE_HERMETIC=1, the only G4_* variable), gate-windows runs clippy and the
# Rust tests: no ROM, no save game, no secret.
#
# PR labels (they only steer this workflow; adding one never starts the macOS job):
#   windows         run gate-windows on this PR (without the label it only runs on main and by hand)
#   ci-skip-macos   skip gate-macos on this PR, for iterations that only concern Windows
#                   (macOS minutes count ten times); remove the label before merging
name: ci

on:
  push:
    branches: [main]
    # GitHub: a later pattern re-includes what an earlier `!` pattern excluded, so CHANGELOG.md
    # (read by `version check`) triggers a run while all other docs and *.md files do not.
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'CHANGELOG.md'
  pull_request:
    branches: [main]
    # The default types plus `labeled`: adding the `windows` label starts gate-windows.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'CHANGELOG.md'
  workflow_dispatch:

# A new push to the same ref cancels the run before it. A `labeled` event gets a group of its
# own (per label), so adding a label never cancels the run of the last push (macOS minutes).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name || 'code' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Smaller caches and no incremental state in target/.
  CARGO_INCREMENTAL: '0'

jobs:
  gate-macos:
    name: gate-macos
    # Not for pull request runs started by a label, not with the label ci-skip-macos.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' &&
      !contains(github.event.pull_request.labels.*.name, 'ci-skip-macos'))
    runs-on: macos-14
    timeout-minutes: 60
    env:
      G4_GATE_HERMETIC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PNPM_VERSION, NODE_VERSION, CARGO_DENY_VERSION, ... for the steps below.
      - name: Tool versions
        run: grep -E '^[A-Z0-9_]+=' scripts/tool-versions.env >> "$GITHUB_ENV"

      # The toolchain of rust-toolchain.toml. rustup 1.28 and later does not install it by
      # itself (not even for `rustup show`), so `toolchain install` without arguments does.
      - name: Rust toolchain
        id: rust
        run: |
          rustup toolchain install
          rustup show
          rustup component add rustfmt clippy
          echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      # Restore here, save at the end of the job: under the exact key only after a green run,
      # after a failure (once the restore ran) under `<key>-partial-<run id>`, which the restore
      # key still finds, so a cold run that fails late (a new clippy lint, a red test) keeps the
      # compiled dependencies without blocking the exact key. `target/*` without `target/tmp`: actions/cache archives
      # a matched folder whole, so an exclusion works only below a wildcard; `target/tmp`
      # (CARGO_TARGET_TMPDIR) holds the synthetic test projects, which do not go into a cache.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/*
            !target/tmp
          key: cargo-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ steps.rust.outputs.version }}-

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      # `cache: pnpm` caches the pnpm store, keyed on the lock file.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/studio/pnpm-lock.yaml

      # uv for scripts/g4emu (the unit tests of the gate); its cache is keyed on uv.lock.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: scripts/g4emu/uv.lock

      - name: pnpm install
        working-directory: apps/studio
        run: pnpm install --frozen-lockfile

      - name: Gate (hermetic)
        run: bash scripts/gate.sh

      # Only a cache that was not an exact hit; the key is the one of the restore step.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/*
            !target/tmp
          key: cargo-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: failure() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/*
            !target/tmp
          key: cargo-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-partial-${{ github.run_id }}

  # Windows gate. Target x86_64-pc-windows-msvc, the host default of windows-latest (the feasibility
  # probe: msvc builds studio, x86_64-pc-windows-gnu fails to link it). Opt-in on pull requests
  # (label `windows`), because the minutes cost; always on main and by hand. It runs clippy and
  # the tests, not scripts/gate.sh.
  gate-windows:
    name: gate-windows
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'windows') &&
      (github.event.action != 'labeled' || github.event.label.name == 'windows'))
    runs-on: windows-latest
    # The kernel lib tests alone took 47 minutes on the runner disk (file I/O and process starts:
    # text project and git tests), against 5 on macOS; target and TEMP now live on a Dev Drive.
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      # Line tables only: smaller target/ and PDBs, shorter links; panics still name lines.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tool versions
        run: grep -E '^[A-Z0-9_]+=' scripts/tool-versions.env >> "$GITHUB_ENV"

      # uxie builds nitroarc with `make ffi` and MinGW gcc (CC=gcc) into nitroarc_ffi.dll.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc make

      # The runner puts the lines of GITHUB_PATH in front of PATH in reverse, so the last line
      # written ends up first. Written in this order the PATH reads: Git bin (Git Bash stays the
      # shell of `shell: bash`, not MSYS2's bash), mingw64 (gcc), MSYS2 usr (make and the tools
      # its Makefile calls), the original PATH.
      - name: MSYS2 on PATH
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          echo "$MSYS2_LOCATION\\usr\\bin" >> "$GITHUB_PATH"
          echo "$MSYS2_LOCATION\\mingw64\\bin" >> "$GITHUB_PATH"
          echo 'C:\Program Files\Git\bin' >> "$GITHUB_PATH"

      # Documents the probe: which bash, gcc and make the later steps get.
      - name: Tool check
        run: |
          command -v bash gcc make
          bash --version | head -1
          gcc --version | head -1

      # A Dev Drive (ReFS, fixed size) for target/ and TEMP: the tests write and delete many small
      # files and start many processes. `trusted-dev-drive` turns on Microsoft's performance
      # mode for the drive; no Defender setting is changed otherwise. 12 GB hold target/ with
      # line tables (the cache of the full debug info was 4.4 GB compressed) and the temp files.
      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 12GB
          drive-format: ReFS
          drive-type: Fixed
          trusted-dev-drive: true
          env-mapping: |
            CARGO_TARGET_DIR,{{ DEV_DRIVE }}/target
            TEMP,{{ DEV_DRIVE }}/tmp
            TMP,{{ DEV_DRIVE }}/tmp

      - name: Dev Drive folders
        run: |
          mkdir -p "$CARGO_TARGET_DIR" "$TEMP"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR TEMP=$TEMP"

      - name: Rust toolchain
        id: rust
        run: |
          rustup toolchain install
          rustup show
          rustup component add clippy
          echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      # Restore here, save at the end of the job (see gate-macos). target/ is the absolute path
      # on the Dev Drive; its drive letter is part of the cache version, so another letter only
      # misses the cache.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}/*
            !${{ env.CARGO_TARGET_DIR }}/tmp
          key: cargo-${{ runner.os }}-msvc-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-msvc-${{ steps.rust.outputs.version }}-

      # One step per command, so the log shows which one fails.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # --no-fail-fast: every test binary runs, so one run shows every failure.
      - name: cargo test
        run: cargo test --workspace --all-features --no-fail-fast

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}/*
            !${{ env.CARGO_TARGET_DIR }}/tmp
          key: cargo-${{ runner.os }}-msvc-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: failure() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}/*
            !${{ env.CARGO_TARGET_DIR }}/tmp
          key: cargo-${{ runner.os }}-msvc-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-partial-${{ github.run_id }}
