# CI of Gen4 Studio (spec release-ci 3.2). It runs only the hermetic part of scripts/gate.sh
# (G4_GATE_HERMETIC=1): no ROM, no save game, no G4_* variable, no secret.
#
# PR labels (they only steer this workflow; adding one never starts the macOS job):
#   windows         run gate-windows on this PR (without the label it only runs on main and by hand)
#   ci-skip-macos   skip gate-macos on this PR, for iterations that only concern Windows
#                   (macOS minutes count ten times); remove the label before merging
name: ci

on:
  push:
    branches: [main]
    # GitHub: a later pattern re-includes what an earlier `!` pattern excluded, so CHANGELOG.md
    # (read by `version check`) triggers a run while all other docs and *.md files do not.
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'CHANGELOG.md'
  pull_request:
    branches: [main]
    # The default types plus `labeled`: adding the `windows` label starts gate-windows.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'CHANGELOG.md'
  workflow_dispatch:

# A new push to the same ref cancels the run before it. A `labeled` event gets a group of its
# own (per label), so adding a label never cancels the run of the last push (macOS minutes).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name || 'code' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Smaller caches and no incremental state in target/.
  CARGO_INCREMENTAL: '0'

jobs:
  gate-macos:
    name: gate-macos
    # Not for pull request runs started by a label, not with the label ci-skip-macos.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' &&
      !contains(github.event.pull_request.labels.*.name, 'ci-skip-macos'))
    runs-on: macos-14
    timeout-minutes: 60
    env:
      G4_GATE_HERMETIC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PNPM_VERSION, NODE_VERSION, CARGO_DENY_VERSION, ... for the steps below.
      - name: Tool versions
        run: grep -E '^[A-Z0-9_]+=' scripts/tool-versions.env >> "$GITHUB_ENV"

      # The toolchain of rust-toolchain.toml. rustup 1.28 and later does not install it by
      # itself (not even for `rustup show`), so `toolchain install` without arguments does.
      - name: Rust toolchain
        id: rust
        run: |
          rustup toolchain install
          rustup show
          rustup component add rustfmt clippy
          echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ steps.rust.outputs.version }}-

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      # `cache: pnpm` caches the pnpm store, keyed on the lock file.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/studio/pnpm-lock.yaml

      # uv for scripts/g4emu (the unit tests of the gate); its cache is keyed on uv.lock.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: scripts/g4emu/uv.lock

      - name: pnpm install
        working-directory: apps/studio
        run: pnpm install --frozen-lockfile

      - name: Gate (hermetic)
        run: bash scripts/gate.sh

  # Feasibility probe and Windows gate. Opt-in on pull requests (label `windows`), because the
  # minutes cost; always on main and by hand. Both Rust targets run in one go for now.
  gate-windows:
    name: gate-windows (${{ matrix.target }})
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'windows') &&
      (github.event.action != 'labeled' || github.event.label.name == 'windows'))
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, x86_64-pc-windows-gnu]
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tool versions
        run: grep -E '^[A-Z0-9_]+=' scripts/tool-versions.env >> "$GITHUB_ENV"

      # uxie builds nitroarc with `make ffi` and MinGW gcc (CC=gcc) into nitroarc_ffi.dll.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc make

      # mingw64 first (gcc), then usr (make and the tools its Makefile calls).
      - name: MSYS2 on PATH
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          echo "$MSYS2_LOCATION\\mingw64\\bin" >> "$GITHUB_PATH"
          echo "$MSYS2_LOCATION\\usr\\bin" >> "$GITHUB_PATH"

      - name: Rust toolchain
        id: rust
        run: |
          rustup toolchain install
          rustup show
          rustup target add ${{ matrix.target }}
          rustup component add clippy
          echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ matrix.target }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.target }}-${{ steps.rust.outputs.version }}-

      # One step per command, so the log shows which one fails. The build comes first: it answers
      # whether the target builds at all.
      - name: cargo build -p studio
        run: cargo build -p studio

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features
