# Gutachten B: the repo has no deny.toml; this allow list is the set of licenses the
# workspace's dependency tree already uses (cargo metadata, 2026-10-26), all permissive.
[graph]
all-features = false
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "Unlicense", "BSL-1.0", "CC0-1.0", "0BSD", "MIT-0",
  "CDLA-Permissive-2.0"]
confidence-threshold = 0.8
[advisories]
version = 2
[bans]
multiple-versions = "allow"
