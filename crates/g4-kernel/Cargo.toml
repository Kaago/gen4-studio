[package]
name = "g4-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# Fixtures (synthetic project, vanilla helpers) for this crate's and downstream tests.
test-support = ["dep:tempfile", "g4-formats/test-support"]

[dependencies]
g4-formats = { path = "../g4-formats" }
g4-xdelta = { path = "../g4-xdelta" }
uxie = "0.9"
chatot = "0.8"
ds-rom = { git = "https://github.com/AetiasHax/ds-rom", rev = "8a9c1512fa5781d9ea53e660f5310e9ab137c53d" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
tempfile = { version = "3", optional = true }
clap = { version = "4", features = ["derive"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rotom = { git = "https://github.com/KalaayPT/rotom", tag = "v0.7.0" }
toml = "0.8"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha1 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
proptest = "1"
