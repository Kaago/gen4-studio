[package]
name = "g4-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Fixtures (synthetic project, vanilla helpers) for this crate's and downstream tests.
test-support = ["dep:tempfile", "g4-formats/test-support"]

[[example]]
# The synthetic project for the packaged smoke test (scripts/smoke-packaged.sh).
name = "make_synthetic"
required-features = ["test-support"]

[dependencies]
g4-formats = { path = "../g4-formats" }
g4-xdelta = { path = "../g4-xdelta" }
uxie = "0.9"
chatot = "0.8"
ds-rom = { git = "https://github.com/AetiasHax/ds-rom", rev = "8a9c1512fa5781d9ea53e660f5310e9ab137c53d" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: header fields in the order uxie declares them (`original::header_fields`).
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
rust-i18n = { workspace = true }
tempfile = { version = "3", optional = true }
clap = { version = "4", features = ["derive"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rotom = { git = "https://github.com/KalaayPT/rotom", tag = "v0.7.0" }
toml = "0.8"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Reads OBJ and MTL for the model import (MIT); without `ahash`.
tobj = { version = "4.0.5", default-features = false }
# Reads glTF and GLB for the model import (MIT OR Apache-2.0); without `import` (no file access,
# no image or base64 copy of its own): buffers and images are resolved by the kernel.
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
# Decodes the `data:` URIs of glTF buffers and images.
base64 = "0.22"
sha1 = "0.11"
serde_path_to_error = "0.1"
# Reads the repository (discover, HEAD, status, blobs at HEAD) in process, pure Rust, no git2
# (decision of phase 4: gix to read, the git CLI to write).
gix = { version = "0.90", default-features = false, features = ["sha1", "status", "index", "revision", "blob-diff"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The change time and file index of a file for the build fingerprints (`build::fingerprint`);
# std has them on nightly only. The version gix and tokio already pull in.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
proptest = "1"
