# Read-only tables in the decompressed arm9/arm9.bin, keyed by game code. Offsets are file
# offsets. The kernel reads a table only for a code without `unverified: true`, and only when
# it passes the plausibility check (TM01 = Focus Punch, HM05 = Defog or Whirlpool, every item
# points at an existing itemData member; icon palettes 0 to 2).
#
# item_table:          8 bytes per item id {data member, icon, palette, GBA item}, item_count ids
# machine_table:       100 x u16 move ids (TM01..TM92, HM01..HM08)
# mon_icon_palettes:   one byte per menu icon (monIcons NCGR member - 7), mon_icon_palettes_len bytes
# trainer_name_max:    characters of a trainer name in vanilla
# trainer_flag_start:  event flag of trainer 0 ("defeated"); trainer_flag_capacity trainers fit
#
# Checked (docs/research/2026-10-23-3b3/task0-3b3a.md): CPUD, IPKD, IPKE. Platinum flags from
# pokeplatinum vars_flags.txt; HGSS flags from pokeheartgold flags.h (TRAINER_FLAG_BASE 0x550,
# next flag 0x82E).
CPUD: { item_table: 0xF0D1C, item_count: 468, machine_table: 0xF0C54, mon_icon_palettes: 0xF07D8, mon_icon_palettes_len: 540, trainer_name_max: 7, trainer_flag_start: 0x550, trainer_flag_capacity: 928 }
IPKD: { item_table: 0x100148, item_count: 537, machine_table: 0x100080, mon_icon_palettes: 0xFFBC4, mon_icon_palettes_len: 544, trainer_name_max: 7, trainer_flag_start: 0x550, trainer_flag_capacity: 734 }
