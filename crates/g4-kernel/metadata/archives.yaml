# Archive locations per game family: `packed` relative to the project root, `unpacked` the
# DSPRE folder below `unpacked/`. Optional keys: `packed_jp` (Japanese ROMs) and `by_game`
# (game code or its first three characters -> path, for a single game or language; the full
# code wins, and either takes precedence over `packed_jp`).
# `pack_only` lists the other folders DSPRE unpacks (paths from DSPRE `DS_Map/RomInfo.cs`):
# the build packs them, no editor reads them. Only folders whose vanilla repack is byte-for-byte
# the NARC on Platinum DE, HeartGold DE and HeartGold US are listed (gated test
# `pack_only_entries_repack_byte_identical`); the others stay below the list as comments with
# the reason, and the build only watches them (`build.unpacked-not-packed`).
dp:
  maps:                    { packed: "files/fielddata/land_data/land_data_release.narc", packed_jp: "files/fielddata/land_data/land_data.narc", unpacked: "maps" }
  matrices:                { packed: "files/fielddata/mapmatrix/map_matrix.narc", unpacked: "matrices" }
  area_data:               { packed: "files/fielddata/areadata/area_data.narc", unpacked: "areaData" }
  events:                  { packed: "files/fielddata/eventdata/zone_event_release.narc", packed_jp: "files/fielddata/eventdata/zone_event.narc", unpacked: "eventFiles" }
  text_archives:           { packed: "files/msgdata/msg.narc", unpacked: "textArchives" }
  map_textures:            { packed: "files/fielddata/areadata/area_map_tex/map_tex_set.narc", unpacked: "mapTextures" }
  building_textures:       { packed: "files/fielddata/areadata/area_build_model/areabm_texset.narc", unpacked: "buildingTextures" }
  building_models:         { packed: "files/fielddata/build_model/build_model.narc", unpacked: "exteriorBuildingModels" }
  # unverified: no DP project at hand; DSPRE RomInfo
  scripts:                 { packed: "files/fielddata/script/scr_seq_release.narc", unpacked: "scripts" }
  # Data archives. unverified: no DP project at hand; DSPRE RomInfo. Pearl (APA) has its own
  # encounter and personal NARCs.
  encounters:              { packed: "files/fielddata/encountdata/d_enc_data.narc", by_game: { APA: "files/fielddata/encountdata/p_enc_data.narc" }, unpacked: "encounters" }
  personal:                { packed: "files/poketool/personal/personal.narc", by_game: { APA: "files/poketool/personal_pearl/personal.narc" }, unpacked: "personalPokeData" }
  learnsets:               { packed: "files/poketool/personal/wotbl.narc", unpacked: "learnsets" }
  evolutions:              { packed: "files/poketool/personal/evo.narc", unpacked: "evolutions" }
  moves:                   { packed: "files/poketool/waza/waza_tbl.narc", unpacked: "moveData" }
  items:                   { packed: "files/itemtool/itemdata/item_data.narc", unpacked: "itemData" }
  trainer_properties:      { packed: "files/poketool/trainer/trdata.narc", unpacked: "trainerProperties" }
  trainer_party:           { packed: "files/poketool/trainer/trpoke.narc", unpacked: "trainerParty" }
  trainer_text_table:      { packed: "files/poketool/trmsg/trtbl.narc", unpacked: "trainerTextTable" }
  trainer_text_offsets:    { packed: "files/poketool/trmsg/trtblofs.narc", unpacked: "trainerTextOffset" }
  # Icon archives (Pokémon menu icons, item bag icons), read only. unverified: no DP project at hand.
  item_icons:              { packed: "files/itemtool/itemdata/item_icon.narc", unpacked: "itemIcons" }
  mon_icons:               { packed: "files/poketool/icongra/poke_icon.narc", unpacked: "monIcons" }
  # Battle sprite archives, read only (`data::battle_sprites`). unverified: no DP project at
  # hand; DSPRE RomInfo.
  pokemon_battle_sprites:  { packed: "files/poketool/pokegra/pokegra.narc", unpacked: "pokemonBattleSprites" }
  other_pokemon_battle_sprites: { packed: "files/poketool/pokegra/otherpoke.narc", unpacked: "otherPokemonBattleSprites" }
  trainer_graphics:        { packed: "files/poketool/trgra/trfgra.narc", unpacked: "trainerGraphics" }
pt:
  maps:                    { packed: "files/fielddata/land_data/land_data.narc", unpacked: "maps" }
  matrices:                { packed: "files/fielddata/mapmatrix/map_matrix.narc", unpacked: "matrices" }
  area_data:               { packed: "files/fielddata/areadata/area_data.narc", unpacked: "areaData" }
  events:                  { packed: "files/fielddata/eventdata/zone_event.narc", unpacked: "eventFiles" }
  text_archives:           { packed: "files/msgdata/pl_msg.narc", unpacked: "textArchives" }
  map_textures:            { packed: "files/fielddata/areadata/area_map_tex/map_tex_set.narc", unpacked: "mapTextures" }
  building_textures:       { packed: "files/fielddata/areadata/area_build_model/areabm_texset.narc", unpacked: "buildingTextures" }
  building_models:         { packed: "files/fielddata/build_model/build_model.narc", unpacked: "exteriorBuildingModels" }
  dynamic_headers:         { packed: "files/debug/cb_edit/d_test.narc", unpacked: "dynamicHeaders" }
  scripts:                 { packed: "files/fielddata/script/scr_seq.narc", unpacked: "scripts" }
  # Data archives. The ROM still holds the DP files (d_/p_enc_data, personal, item_data,
  # waza_tbl); only the pl_ variants are read by the game.
  encounters:              { packed: "files/fielddata/encountdata/pl_enc_data.narc", unpacked: "encounters" }
  personal:                { packed: "files/poketool/personal/pl_personal.narc", unpacked: "personalPokeData" }
  learnsets:               { packed: "files/poketool/personal/wotbl.narc", unpacked: "learnsets" }
  evolutions:              { packed: "files/poketool/personal/evo.narc", unpacked: "evolutions" }
  moves:                   { packed: "files/poketool/waza/pl_waza_tbl.narc", unpacked: "moveData" }
  items:                   { packed: "files/itemtool/itemdata/pl_item_data.narc", unpacked: "itemData" }
  trainer_properties:      { packed: "files/poketool/trainer/trdata.narc", unpacked: "trainerProperties" }
  trainer_party:           { packed: "files/poketool/trainer/trpoke.narc", unpacked: "trainerParty" }
  trainer_text_table:      { packed: "files/poketool/trmsg/trtbl.narc", unpacked: "trainerTextTable" }
  trainer_text_offsets:    { packed: "files/poketool/trmsg/trtblofs.narc", unpacked: "trainerTextOffset" }
  # Icon archives, read only. monIcons has 547 members: the NCLR, six animation members, 540 icons.
  item_icons:              { packed: "files/itemtool/itemdata/item_icon.narc", unpacked: "itemIcons" }
  mon_icons:               { packed: "files/poketool/icongra/pl_poke_icon.narc", unpacked: "monIcons" }
  # Battle sprite archives, read only (`data::battle_sprites`): 2964 members (494 species x 6),
  # the forms and eggs (253 members), five members per trainer class (525).
  pokemon_battle_sprites:  { packed: "files/poketool/pokegra/pl_pokegra.narc", unpacked: "pokemonBattleSprites" }
  other_pokemon_battle_sprites: { packed: "files/poketool/pokegra/pl_otherpoke.narc", unpacked: "otherPokemonBattleSprites" }
  trainer_graphics:        { packed: "files/poketool/trgra/trfgra.narc", unpacked: "trainerGraphics" }
  # Egg moves (`data::egg_moves`): only with DSPRE's egg move patch present; vanilla Platinum
  # keeps the table in overlay 5 (`overlay_tables.yaml`), and the build packs the folder only
  # when it exists.
  egg_moves:               { packed: "files/zcustom/egg_moves.narc", unpacked: "eggMoves" }
  pack_only:
    - { packed: "files/data/mmodel/mmodel.narc", unpacked: "OWSprites" }
    - { packed: "files/battle/graphic/pl_batt_bg.narc", unpacked: "battleBg" }
    - { packed: "files/battle/b_pl_tower/pl_btdpm.narc", unpacked: "battleTowerPokemon" }
    - { packed: "files/battle/b_pl_tower/pl_btdtr.narc", unpacked: "battleTowerTrainers" }
    - { packed: "files/fielddata/areadata/area_build_model/area_build.narc", unpacked: "buildingConfigFiles" }
    - { packed: "files/arc/encdata_ex.narc", unpacked: "encounterExtended" }
    - { packed: "files/poketool/pokegra/height.narc", unpacked: "pokeHeight" }
    - { packed: "files/poketool/pokegra/height_o.narc", unpacked: "pokeHeightForms" }
    - { packed: "files/poketool/poke_edit/pl_poke_data.narc", unpacked: "pokemonSpriteOffsets" }
    - { packed: "files/data/weather_sys.narc", unpacked: "synthOverlay" }
    # Japanese and English ROMs keep the trade data in `fielddata`, the others per language.
    - { packed: "files/fielddata/pokemon_trade/fld_trade.narc", by_game: { CPUD: "files/resource/ger/pokemon_trade/fld_trade.narc", CPUF: "files/resource/fra/pokemon_trade/fld_trade.narc", CPUI: "files/resource/ita/pokemon_trade/fld_trade.narc", CPUS: "files/resource/spa/pokemon_trade/fld_trade.narc" }, unpacked: "tradeData" }
  # Not packed (no vanilla NARC; vanilla Platinum projects have neither folder):
  # battleObj: DSPRE names files/battle/graphic/pl_batt_obj.narc, which Platinum does not have.
hgss:
  maps:                    { packed: "files/a/0/6/5", unpacked: "maps" }
  matrices:                { packed: "files/a/0/4/1", unpacked: "matrices" }
  area_data:               { packed: "files/a/0/4/2", unpacked: "areaData" }
  events:                  { packed: "files/a/0/3/2", unpacked: "eventFiles" }
  text_archives:           { packed: "files/a/0/2/7", unpacked: "textArchives" }
  map_textures:            { packed: "files/a/0/4/4", unpacked: "mapTextures" }
  building_textures:       { packed: "files/a/0/7/0", unpacked: "buildingTextures" }
  building_models:         { packed: "files/a/0/4/0", unpacked: "exteriorBuildingModels" }
  interior_building_models: { packed: "files/a/1/4/8", unpacked: "interiorBuildingModels" }
  dynamic_headers:         { packed: "files/a/0/5/0", unpacked: "dynamicHeaders" }
  scripts:                 { packed: "files/a/0/1/2", unpacked: "scripts" }
  # Data archives. SoulSilver (IPG) keeps its encounters in a/1/3/6.
  encounters:              { packed: "files/a/0/3/7", by_game: { IPG: "files/a/1/3/6" }, unpacked: "encounters" }
  personal:                { packed: "files/a/0/0/2", unpacked: "personalPokeData" }
  learnsets:               { packed: "files/a/0/3/3", unpacked: "learnsets" }
  evolutions:              { packed: "files/a/0/3/4", unpacked: "evolutions" }
  moves:                   { packed: "files/a/0/1/1", unpacked: "moveData" }
  items:                   { packed: "files/a/0/1/7", unpacked: "itemData" }
  trainer_properties:      { packed: "files/a/0/5/5", unpacked: "trainerProperties" }
  trainer_party:           { packed: "files/a/0/5/6", unpacked: "trainerParty" }
  trainer_text_table:      { packed: "files/a/0/5/7", unpacked: "trainerTextTable" }
  trainer_text_offsets:    { packed: "files/a/1/3/1", unpacked: "trainerTextOffset" }
  # Icon archives, read only. monIcons has 551 members: the NCLR, six animation members, 544 icons.
  item_icons:              { packed: "files/a/0/1/8", unpacked: "itemIcons" }
  mon_icons:               { packed: "files/a/0/2/0", unpacked: "monIcons" }
  # Battle sprite archives, read only (`data::battle_sprites`): 2964 members (494 species x 6),
  # the forms and eggs (261 members), five members per trainer class (645).
  pokemon_battle_sprites:  { packed: "files/a/0/0/4", unpacked: "pokemonBattleSprites" }
  other_pokemon_battle_sprites: { packed: "files/a/1/1/4", unpacked: "otherPokemonBattleSprites" }
  trainer_graphics:        { packed: "files/a/0/5/8", unpacked: "trainerGraphics" }
  # Egg moves (`data::egg_moves`): one member, the whole table; the vanilla NARC repacks
  # byte-identical.
  egg_moves:               { packed: "files/a/2/2/9", unpacked: "eggMoves" }
  pack_only:
    - { packed: "files/a/0/8/1", unpacked: "OWSprites" }
    - { packed: "files/a/0/0/7", unpacked: "battleBg" }
    - { packed: "files/a/0/0/8", unpacked: "battleObj" }
    - { packed: "files/a/2/0/3", unpacked: "battleTowerPokemon" }
    - { packed: "files/a/2/0/2", unpacked: "battleTowerTrainers" }
    - { packed: "files/a/0/4/3", unpacked: "buildingConfigFiles" }
    - { packed: "files/a/2/5/2", unpacked: "headbutt" }
    - { packed: "files/a/0/0/5", unpacked: "pokeHeight" }
    - { packed: "files/a/1/8/0", unpacked: "pokemonSpriteOffsets" }
    - { packed: "files/a/2/5/3", unpacked: "rockSmash" }
    - { packed: "files/a/2/3/0", unpacked: "safariZone" }
    - { packed: "files/a/0/2/8", unpacked: "synthOverlay" }
    - { packed: "files/a/1/1/2", unpacked: "tradeData" }
