# Archive locations per game family: `packed` relative to the project root, `unpacked` the
# DSPRE folder below `unpacked/`. Optional keys: `packed_jp` (Japanese ROMs) and `by_game`
# (game code prefix -> path, for a single game of the pair; takes precedence over `packed_jp`).
dp:
  maps:                    { packed: "files/fielddata/land_data/land_data_release.narc", packed_jp: "files/fielddata/land_data/land_data.narc", unpacked: "maps" }
  matrices:                { packed: "files/fielddata/mapmatrix/map_matrix.narc", unpacked: "matrices" }
  area_data:               { packed: "files/fielddata/areadata/area_data.narc", unpacked: "areaData" }
  events:                  { packed: "files/fielddata/eventdata/zone_event_release.narc", packed_jp: "files/fielddata/eventdata/zone_event.narc", unpacked: "eventFiles" }
  text_archives:           { packed: "files/msgdata/msg.narc", unpacked: "textArchives" }
  map_textures:            { packed: "files/fielddata/areadata/area_map_tex/map_tex_set.narc", unpacked: "mapTextures" }
  building_textures:       { packed: "files/fielddata/areadata/area_build_model/areabm_texset.narc", unpacked: "buildingTextures" }
  building_models:         { packed: "files/fielddata/build_model/build_model.narc", unpacked: "exteriorBuildingModels" }
  # unverified: no DP project at hand; DSPRE RomInfo
  scripts:                 { packed: "files/fielddata/script/scr_seq_release.narc", unpacked: "scripts" }
  # Data archives. unverified: no DP project at hand; DSPRE RomInfo. Pearl (APA) has its own
  # encounter and personal NARCs.
  encounters:              { packed: "files/fielddata/encountdata/d_enc_data.narc", by_game: { APA: "files/fielddata/encountdata/p_enc_data.narc" }, unpacked: "encounters" }
  personal:                { packed: "files/poketool/personal/personal.narc", by_game: { APA: "files/poketool/personal_pearl/personal.narc" }, unpacked: "personalPokeData" }
  learnsets:               { packed: "files/poketool/personal/wotbl.narc", unpacked: "learnsets" }
  evolutions:              { packed: "files/poketool/personal/evo.narc", unpacked: "evolutions" }
  moves:                   { packed: "files/poketool/waza/waza_tbl.narc", unpacked: "moveData" }
  items:                   { packed: "files/itemtool/itemdata/item_data.narc", unpacked: "itemData" }
  trainer_properties:      { packed: "files/poketool/trainer/trdata.narc", unpacked: "trainerProperties" }
  trainer_party:           { packed: "files/poketool/trainer/trpoke.narc", unpacked: "trainerParty" }
  trainer_text_table:      { packed: "files/poketool/trmsg/trtbl.narc", unpacked: "trainerTextTable" }
  trainer_text_offsets:    { packed: "files/poketool/trmsg/trtblofs.narc", unpacked: "trainerTextOffset" }
pt:
  maps:                    { packed: "files/fielddata/land_data/land_data.narc", unpacked: "maps" }
  matrices:                { packed: "files/fielddata/mapmatrix/map_matrix.narc", unpacked: "matrices" }
  area_data:               { packed: "files/fielddata/areadata/area_data.narc", unpacked: "areaData" }
  events:                  { packed: "files/fielddata/eventdata/zone_event.narc", unpacked: "eventFiles" }
  text_archives:           { packed: "files/msgdata/pl_msg.narc", unpacked: "textArchives" }
  map_textures:            { packed: "files/fielddata/areadata/area_map_tex/map_tex_set.narc", unpacked: "mapTextures" }
  building_textures:       { packed: "files/fielddata/areadata/area_build_model/areabm_texset.narc", unpacked: "buildingTextures" }
  building_models:         { packed: "files/fielddata/build_model/build_model.narc", unpacked: "exteriorBuildingModels" }
  dynamic_headers:         { packed: "files/debug/cb_edit/d_test.narc", unpacked: "dynamicHeaders" }
  scripts:                 { packed: "files/fielddata/script/scr_seq.narc", unpacked: "scripts" }
  # Data archives. The ROM still holds the DP files (d_/p_enc_data, personal, item_data,
  # waza_tbl); only the pl_ variants are read by the game.
  encounters:              { packed: "files/fielddata/encountdata/pl_enc_data.narc", unpacked: "encounters" }
  personal:                { packed: "files/poketool/personal/pl_personal.narc", unpacked: "personalPokeData" }
  learnsets:               { packed: "files/poketool/personal/wotbl.narc", unpacked: "learnsets" }
  evolutions:              { packed: "files/poketool/personal/evo.narc", unpacked: "evolutions" }
  moves:                   { packed: "files/poketool/waza/pl_waza_tbl.narc", unpacked: "moveData" }
  items:                   { packed: "files/itemtool/itemdata/pl_item_data.narc", unpacked: "itemData" }
  trainer_properties:      { packed: "files/poketool/trainer/trdata.narc", unpacked: "trainerProperties" }
  trainer_party:           { packed: "files/poketool/trainer/trpoke.narc", unpacked: "trainerParty" }
  trainer_text_table:      { packed: "files/poketool/trmsg/trtbl.narc", unpacked: "trainerTextTable" }
  trainer_text_offsets:    { packed: "files/poketool/trmsg/trtblofs.narc", unpacked: "trainerTextOffset" }
hgss:
  maps:                    { packed: "files/a/0/6/5", unpacked: "maps" }
  matrices:                { packed: "files/a/0/4/1", unpacked: "matrices" }
  area_data:               { packed: "files/a/0/4/2", unpacked: "areaData" }
  events:                  { packed: "files/a/0/3/2", unpacked: "eventFiles" }
  text_archives:           { packed: "files/a/0/2/7", unpacked: "textArchives" }
  map_textures:            { packed: "files/a/0/4/4", unpacked: "mapTextures" }
  building_textures:       { packed: "files/a/0/7/0", unpacked: "buildingTextures" }
  building_models:         { packed: "files/a/0/4/0", unpacked: "exteriorBuildingModels" }
  interior_building_models: { packed: "files/a/1/4/8", unpacked: "interiorBuildingModels" }
  dynamic_headers:         { packed: "files/a/0/5/0", unpacked: "dynamicHeaders" }
  scripts:                 { packed: "files/a/0/1/2", unpacked: "scripts" }
  # Data archives. SoulSilver (IPG) keeps its encounters in a/1/3/6.
  encounters:              { packed: "files/a/0/3/7", by_game: { IPG: "files/a/1/3/6" }, unpacked: "encounters" }
  personal:                { packed: "files/a/0/0/2", unpacked: "personalPokeData" }
  learnsets:               { packed: "files/a/0/3/3", unpacked: "learnsets" }
  evolutions:              { packed: "files/a/0/3/4", unpacked: "evolutions" }
  moves:                   { packed: "files/a/0/1/1", unpacked: "moveData" }
  items:                   { packed: "files/a/0/1/7", unpacked: "itemData" }
  trainer_properties:      { packed: "files/a/0/5/5", unpacked: "trainerProperties" }
  trainer_party:           { packed: "files/a/0/5/6", unpacked: "trainerParty" }
  trainer_text_table:      { packed: "files/a/0/5/7", unpacked: "trainerTextTable" }
  trainer_text_offsets:    { packed: "files/a/1/3/1", unpacked: "trainerTextOffset" }
