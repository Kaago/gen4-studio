# Dynamic Headers patch: the routine, the instruction sites it rewrites and the NARC that
# holds the headers afterwards. Offsets are file offsets in the decompressed arm9/arm9.bin.
# Source: DSPRE ToolboxDB.cs (DynamicHeadersPatchData) and PatchToolboxDialog.cs
# (dynamicHeadersButton_Click); facts about the game binaries, not DSPRE code.
#
# `init`: where the 20-byte routine goes in each game and what it is. The routine calls two
# functions with a Thumb `bl` at byte 8 (load a NARC member) and at byte 14 (free it); `apply`
# decodes both and refuses unless `targets` matches at each. IPGS has no entry of its own in
# DSPRE (it takes the IPKE default). CPUS, CPUI, CPUF and CPUD deviate from DSPRE: DSPRE's
# free call `CC F7 74 FC` lands at 0x69C2, in the middle of a function, and the game hangs;
# `DE F7 AD F8` calls 0x18234, the address DSPRE's own comment names for these versions
# (see docs/formats/dynamic_headers.md).
init:
  CPUE: { offset: 0x3A024, bytes: "00 B5 01 1C 94 20 00 22 CC F7 48 FD 03 1C DE F7 C7 F8 00 BD" }
  CPUS: { offset: 0x3A0C8, bytes: "00 B5 01 1C 94 20 00 22 CC F7 00 FD 03 1C DE F7 AD F8 00 BD" }
  CPUI: { offset: 0x3A0C8, bytes: "00 B5 01 1C 94 20 00 22 CC F7 00 FD 03 1C DE F7 AD F8 00 BD" }
  CPUF: { offset: 0x3A0C8, bytes: "00 B5 01 1C 94 20 00 22 CC F7 00 FD 03 1C DE F7 AD F8 00 BD" }
  CPUD: { offset: 0x3A0C8, bytes: "00 B5 01 1C 94 20 00 22 CC F7 00 FD 03 1C DE F7 AD F8 00 BD" }
  CPUJ: { offset: 0x39BE0, bytes: "00 B5 01 1C 94 20 00 22 CC F7 0A FF 03 1C DE F7 3D F9 00 BD" }
  IPKS: { offset: 0x3B260, bytes: "00 B5 01 1C 32 20 00 22 CC F7 5C F9 03 1C DF F7 4D FC 00 BD" }
  IPKJ: { offset: 0x3AE20, bytes: "00 B5 01 1C 32 20 00 22 CC F7 08 FB 03 1C DF F7 C7 FC 00 BD" }
  IPGJ: { offset: 0x3AE20, bytes: "00 B5 01 1C 32 20 00 22 CC F7 08 FB 03 1C DF F7 C7 FC 00 BD" }
  IPKE: { offset: 0x3B268, bytes: "00 B5 01 1C 32 20 00 22 CC F7 58 F9 03 1C DF F7 49 FC 00 BD" }
  IPGE: { offset: 0x3B268, bytes: "00 B5 01 1C 32 20 00 22 CC F7 58 F9 03 1C DF F7 49 FC 00 BD" }
  IPGS: { offset: 0x3B268, bytes: "00 B5 01 1C 32 20 00 22 CC F7 58 F9 03 1C DF F7 49 FC 00 BD" }
  IPKF: { offset: 0x3B268, bytes: "00 B5 01 1C 32 20 00 22 CC F7 58 F9 03 1C DF F7 49 FC 00 BD" }
  IPGF: { offset: 0x3B268, bytes: "00 B5 01 1C 32 20 00 22 CC F7 58 F9 03 1C DF F7 49 FC 00 BD" }
  IPKI: { offset: 0x3B268, bytes: "00 B5 01 1C 32 20 00 22 CC F7 58 F9 03 1C DF F7 49 FC 00 BD" }
  IPGI: { offset: 0x3B268, bytes: "00 B5 01 1C 32 20 00 22 CC F7 58 F9 03 1C DF F7 49 FC 00 BD" }
  IPKD: { offset: 0x3B268, bytes: "00 B5 01 1C 32 20 00 22 CC F7 58 F9 03 1C DF F7 49 FC 00 BD" }
  IPGD: { offset: 0x3B268, bytes: "00 B5 01 1C 32 20 00 22 CC F7 58 F9 03 1C DF F7 49 FC 00 BD" }

# The first bytes of the two functions the routine calls, the same in Platinum DE and
# HeartGold DE/US: `load` is the whole 24-byte function at 0x6AD4 (CPUD) and 0x7524
# (IPKD/IPKE), `free` the start of the one at 0x18234 and 0x1AB0C. Its `push {r3-r7,lr}`
# matters: the routine keeps the loaded pointer in r3 across the call.
targets:
  load: "10 B5 82 B0 00 23 00 93 84 00 03 48 01 93 00 59 FF F7 6A FF 02 B0 10 BD"
  free: "F8 B5 06 1C 30 1F 00 68 00 06 04 0E 18 48 81 8A"

# The games whose routine was checked against their own arm9.bin (and, for CPUD, in game).
# Every other one relies on the check of `targets` when the patch is applied.
verified: [CPUD, IPKD, IPKE]

# Per family: the reference game (`base`, whose `init` offset the lists below are written
# for; every other game shifts them by init.offset(game) - init.offset(base)), the NARC
# (relative to the project root) and the (mov r1,#0x18 site, literal) pairs.
families:
  pt:
    base: CPUE
    narc: files/debug/cb_edit/d_test.narc
    references: [[0x3A03E, 0x3A048], [0x3A052, 0x3A05C], [0x3A066, 0x3A080], [0x3A08E, 0x3A098], [0x3A0A2, 0x3A0AC], [0x3A0B6, 0x3A0C0], [0x3A0CA, 0x3A0D4], [0x3A0DE, 0x3A0E8], [0x3A0F2, 0x3A108], [0x3A116, 0x3A120], [0x3A12A, 0x3A134], [0x3A13E, 0x3A150], [0x3A15A, 0x3A170], [0x3A17A, 0x3A184], [0x3A18E, 0x3A198], [0x3A1A2, 0x3A1B4], [0x3A1BE, 0x3A1D0], [0x3A1DA, 0x3A1EC], [0x3A1F6, 0x3A208], [0x3A212, 0x3A224]]
  hgss:
    base: IPKE
    narc: files/a/0/5/0
    references: [[0x3B282, 0x3B28C], [0x3B296, 0x3B2A8], [0x3B2B2, 0x3B2BC], [0x3B2C6, 0x3B2D0], [0x3B2DA, 0x3B2E4], [0x3B2EE, 0x3B2F8], [0x3B302, 0x3B30C], [0x3B316, 0x3B320], [0x3B32A, 0x3B340], [0x3B34A, 0x3B354], [0x3B35E, 0x3B368], [0x3B372, 0x3B384], [0x3B38E, 0x3B3A4], [0x3B3AE, 0x3B3C4], [0x3B3CE, 0x3B3E0], [0x3B3EA, 0x3B3FC], [0x3B406, 0x3B418], [0x3B422, 0x3B434], [0x3B43E, 0x3B450], [0x3B45A, 0x3B46C], [0x3B476, 0x3B488], [0x3B492, 0x3B4A4], [0x3B4AE, 0x3B4C0], [0x3B4CA, 0x3B4D8], [0x3B4E2, 0x3B4F4], [0x3B4FE, 0x3B514]]
    # Only when the language is neither Japanese nor Spanish: an instruction sits between
    # `mov r1,#0x18` and `mul r1,r0`.
    special_case: { mov: 0x3B522, mul: 0x3B526, literal: 0x3B53C }

# Folder under unpacked/ that holds one file per header.
unpacked: dynamicHeaders
