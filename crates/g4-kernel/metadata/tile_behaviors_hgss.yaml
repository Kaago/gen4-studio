# Tile behaviour names and classes of the HeartGold / SoulSilver map permission 'kind' byte.
# Values are positions in the TILE_BEHAVIOR enum of pret/pokeheartgold
# (include/constants/metatile_behavior.h, commit 6988158691eb6178cff697cda0428045ddcba5fb), except the
# explicit assignment NONE = 255; numeric entries (TILE_BEHAVIOR_<n>) and *_UNUSED entries are omitted.
# Used by the tile hover and overlay colours.

