# Battle sprites (pokemonBattleSprites, otherPokemonBattleSprites, trainerGraphics): the decryption
# direction per archive and family, measured on Platinum DE, HeartGold DE and HeartGold US
# (docs/research/2026-10-30-phase-3d/gutachten-c-sprites-krypto.py), and the form table of
# otherPokemonBattleSprites (3d.3 Task 3, by eye). DP is unverified: no project at hand.
direction:
  pt:   { pokemon: forward, other: forward, trainer: forward }
  hgss: { pokemon: forward, other: forward, trainer: backward }
  dp:   { unverified: true, pokemon: forward, other: forward, trainer: forward }
# The form table: per family, the members of each form's images in otherPokemonBattleSprites,
# checked by eye on Platinum DE and HeartGold DE (docs/research/2026-10-30-phase-3d/
# task3-3d3-formen.md; HeartGold US is byte-identical). `form` is the game's form index. Form 0
# of every species with forms has an entry too: the game draws such a species only from this
# archive, and its entry in pokemonBattleSprites differs for most (Cherrim there is the Sunshine
# Form, Burmy's shiny palette there is its normal one; measured 2026-10-31, 3d.3 final review).
# The egg (personal member 494) lives here alone. `personal` names the personal member 494 to
# 507 a form has (form 0 has none: it is the species itself); `back` and `front` are images
# (160 x 80, two frames), `palette` and `shiny` NCLR members. No form has female images of its
# own (`female_back`, `female_front`). An entry marked `unverified: true` is ignored and form 0
# is shown, as for a form without an entry. Diamond/Pearl has no table (unverified).
forms:
  pt:
    # Deoxys (386): back 2f, front 2f + 1; one palette pair for every form. 0 Normal, 1 Attack, 2 Defense, 3 Speed
    - { species: 386, form: 0, back: 0, front: 1, palette: 154, shiny: 155 }
