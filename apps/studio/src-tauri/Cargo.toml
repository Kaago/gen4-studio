[package]
name = "studio"
version.workspace = true
description = "Gen4 Studio: Pokemon Gen 4 world editor"
authors = ["Philipp Polte"]
edition.workspace = true
license.workspace = true
# `pnpm tauri dev` runs `cargo run`; with the second binary (`studio-bridge`) cargo needs to know which one.
default-run = "studio"

[lib]
# The `_lib` suffix is needed to keep the lib name unique from the bin name (Windows).
name = "studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Dev-only HTTP bridge (`studio-bridge`) that lets an agent drive the UI in a browser.
dev-bridge = ["dep:tiny_http"]

[[bin]]
name = "studio-bridge"
path = "src/bin/studio-bridge.rs"
required-features = ["dev-bridge"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# The auto-updater: checks GitHub Releases for a newer signed build (`commands::update`).
tauri-plugin-updater = "2"
g4-kernel = { path = "../../../crates/g4-kernel" }
g4-formats = { path = "../../../crates/g4-formats" }
# `studio doctor` calls nitroarc through uxie to prove the shared library loads.
uxie = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = { version = "0.12", optional = true }
clap = { version = "4", features = ["derive"] }
# `studio mcp`: the editor's tools for coding agents over stdio (Model Context Protocol).
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "fs", "net", "time"] }
libc = "0.2"
# The running app serves MCP over Streamable HTTP on 127.0.0.1 (`mcp::http`).
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
getrandom = "0.4"
# The project preview travels as base64 in JSON (`commands::preview`).
base64 = "0.23"
# The message catalogs (`locales/{en,de}.yml`, `t!`); the locale is shared with g4-kernel.
rust-i18n = { workspace = true }
# "System" in Settings › Language: the OS locale; WKWebView's `navigator.language` may report the bundle's localizations rather than the OS language.
sys-locale = { workspace = true }

# `studio doctor` attaches to the console of the shell that started it (`doctor.rs`), `studio
# mcp` keeps stray stdout out of the protocol (`mcp::stdout`); the version gix and tokio already
# pull in.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
# The mock runtime: the updater is built on a mock app to test a stalled download (`commands::update`).
tauri = { version = "2", features = ["test"] }
g4-kernel = { path = "../../../crates/g4-kernel", features = ["test-support"] }
g4-formats = { path = "../../../crates/g4-formats", features = ["test-support"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["process", "time", "io-util"] }
