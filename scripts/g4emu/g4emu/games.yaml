# Per game code (ROM header offset 0x0C). The location record is
# {u32 header; i32 warp; u32 x; u32 y} at (u32 @ pointer) + offset.
# battle: a BattleMon record has eight bytes 06 (neutral stat boosts) at +0x18, the species (u16)
# at +0 and the level (u8) at +0x34; records lie on 4-byte boundaries, 0xC0 apart (player, enemy).
# battle_pointer: u32 that is 0 outside a battle (CPUD only; measured in 3b.3b).
# home_header: where a lost battle without a party ends (the game warps home).
CPUD:
  name: Platin DE
  location: { pointer: 0x02101EE0, offset: 0x1294 }
  save: CPUD-zimmer.sav
  start_header: 415
  continue_frames: 1200  # overworld shows up around frame 950; the pointer is valid from 107
  battle: { signature: "06x8@0x18", species_at: 0, level_at: 0x34 }
  battle_pointer: 0x02101F88
  home_header: 414
IPKD:
  name: HeartGold DE
  location: { pointer: 0x02111860, offset: 0x1244 }
  save: IPKD-zimmer.sav
  start_header: 64
  continue_frames: 1000  # overworld fully visible at ~955, controllable from ~945; pointer valid from 193
  battle: { signature: "06x8@0x18", species_at: 0, level_at: 0x34 }
  home_header: 63
IPKE:
  name: HeartGold US
  location: { pointer: 0x02111880, offset: 0x1244 }
  save: IPKE-zimmer.sav
  start_header: 64
  continue_frames: 1000  # same timing as IPKD (overworld visible at ~955)
  battle: { signature: "06x8@0x18", species_at: 0, level_at: 0x34 }  # as IPKD, not measured
  home_header: 63
