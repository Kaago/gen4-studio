[project]
name = "g4emu"
version = "0.1.0"
description = "Headless Nintendo DS emulator harness for the gen4-studio agent test loop"
requires-python = ">=3.12,<3.13"
dependencies = [
    "libretro.py==0.12.0",
    "pillow",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
g4emu = "g4emu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["g4emu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the real emulator core and ROMs"]
