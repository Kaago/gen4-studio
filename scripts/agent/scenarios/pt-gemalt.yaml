# Platin DE, phase gate 6 (agent part of gate 6.3b): a NEW map painted by commands in the text
# project (`world_create`, `tileset_edit`, `world_edit`), baked by the studio (model, BDHC and
# derived permissions from the world), built by the build step `world` and walked in the game: the
# stair works (`expect-height`), the wall blocks (`walk-until-blocked`), the grass gives a wild
# battle (`expect-battle`), and the outdoor light is looked at by day (`shot tag`, 12:00) and by
# night (`shot nacht`, 23:00).
#
# Clock probe (Task 11 step 1, 07.11.2026): POSITIVE. melonDS DS reads the core options
# melonds_start_time_mode = absolute and melonds_start_time_absolute_{hour,minute,second} when the
# console starts ("Starting the RTC at 2004-01-01 11:00:00 PM (ignoring the local time)" in
# core.log); g4emu's step `clock HH:MM` sets them and resets the console (the cartridge memory
# stays), so `continue` follows every `clock`. Night is agent + look, not a hand point.
#
# The project becomes a text project first (`assign_base` with the .nds beside the copy,
# `adopt_text_project`, which adopts the scripts too). The new map is a 1x1 area on a NEW header from
# Route 201 map 5 (matrix 0 cell (3, 26), template header 342, area data 6, map texture pack 6) with a
# new event file (`create_area`, internal name T_GEMALT, the copied buildings cleared); the bedroom
# stairs (header 415, event file 394, warp 0) lead there, the arrival is warp 0 on the door (12, 21)
# back to the stairs; the player arrives on the door and steps east by itself to (13, 21). Its header
# gets a new encounter file (grass rate 100, all 12 grass slots and the day/night lists S_WILD at
# L_WILD) and a new script file whose script 1 is empty and script 2 the gift (S_GIFT at level 100,
# once, by a flag; the save has no Pokémon), talked to from (14, 22). As in pt-gelaende.yaml.
#
# The painted world is fixtures::gate_world (crates/g4-kernel/src/world/doc.rs), cells (x, z):
#   | Area                  | x     | z     | tile   | height (steps) | ramp | permission     |
#   |-----------------------|-------|-------|--------|----------------|------|----------------|
#   | ground                | rest  | rest  | GROUND | 0              | .    | derived        |
#   | tall grass            | 16-28 | 3-10  | GRASS  | 0              | .    | derived [2, 0] |
#   | water                 | 2-8   | 24-29 | WATER  | 0              | .    | derived [21,0] |
#   | stair, lower tile     | 16    | 20-22 | GROUND | 0              | e1   | derived        |
#   | stair, upper tile     | 17    | 20-22 | GROUND | 1              | e1   | derived        |
#   | plateau 16 E          | 18-22 | 20-22 | GROUND | 2              | .    | derived        |
#   | door (arrival, warp 0)| 12    | 21    | GROUND | 0              | .    | hand 6980      |
#   | gift (figure)         | 14    | 23    | GROUND | 0              | .    | derived        |
# Tiles of the derived tileset of pack 6 (indices only, chosen by looking at get_tileset_texture):
# GROUND 28 = 001c (light green, plain), GRASS 33 = 0021 (green with light patches), WATER 44 = 002c
# (blue waves), WALL 13 (brown rock). `tileset_save` writes the tileset file, `tileset_edit` makes
# GRASS role grass, kind 2, collision 0; WATER role water, kind 21 (0x15), collision 0; WALL role
# wall; GROUND gets `wall: 13` (the walls below a ground cell take WALL's texture).
# Derived collision: an edge of 16 E or more blocks the higher cell, so of the plateau only the
# inner cells of row 21 are open: rows 20 and 22 lie 16 E over rows 19 and 23, (22, 21) 16 E over
# (23, 21); the stair's edges are 8 E at most (open). get_map shows it at permissions index
# z * 32 + x: grass (16, 3) 112 = [2, 0], water (2, 24) 770 = [21, 0], plateau border (22, 21)
# 694 = [0, 128], door (12, 21) 684 = [105, 128].
#
# Play: `clock 12:00`, to the new map, the gift; the stair: 0 on (14, 21), 16 on the plateau
# (18, 21), back onto the upper stair tile 12 (17, 21), up again; east on the plateau stops at
# (21, 21); down the stair and along row 25 to (20, 25), north against the plateau's wall stops at
# (20, 23) (row 22 blocked): `shot tag` looks north at wall, plateau and stair; `shot wasser` at
# (11, 25) shows the water west, `shot wiese` at (16, 11) the tall grass north; then into the grass
# for the battle.
# Then `clock 23:00`, `continue` (the bedroom again, the save was never written), the same way to
# the wall at (20, 23) and `shot nacht`.
#
# Placeholders (all required, passed with --set NAME=VALUE):
#   BASIS         the .nds beside the copy, relative to the project folder (../<copy>.nds)
#   NEUER_HEADER  id the new header gets = the header count before (593 on an unmodified Platin DE)
#   S_WILD L_WILD wild species and level (150 Mewtu, 5)
#   S_GIFT        the gift, level 100 (445 Knakrack)
# Names an edit binds (third element) come from the bridge's answers: area (create_area), hdr, enc,
# geber_datei, w (world_create: map, tileset, cells, change, bake).
# Example (from scripts/g4emu; the copy lives under Roms/_testkopien; from a worktree set
# G4_ROMS_DIR (absolute), G4_BRIDGE_BIN and G4K_BIN to target/debug/studio-bridge and
# target/debug/g4k after `cargo build --workspace --all-features`, see docs/agent-gate.md):
#   uv run g4emu scenario ../agent/scenarios/pt-gemalt.yaml \
#     --project $G4_ROMS_DIR/_testkopien/6-3b-szen-pt_DSPRE_contents \
#     --out $W/target/agent/gate-$(date +%F)/6-3b/pt-gemalt \
#     --set BASIS=../6-3b-szen-pt.nds --set NEUER_HEADER=593 --set S_WILD=150 --set L_WILD=5 --set S_GIFT=445
# A copy that ran past the build is saved and built: every run needs a fresh copy.
game: CPUD
edits:
  # (1) base ROM, patch, text project (adopts the scripts), the new place
  - [assign_base, {nds: "${BASIS}"}]
  - [apply_header_patch, {}]
  - [adopt_text_project, {}]
  - - create_area
    - spec:
        name: Gemalt
        width: 1
        height: 1
        cells:                       # Route 201 (header 342): matrix 0 cell (3, 26) = map 5
          - {x: 0, y: 0, source_map: 5, clear_buildings: true}
        with_headers: true
        header:
          id: "${NEUER_HEADER}"
          area_data_id: null
          event_file: New
          new_header: {template: 342, internal_name: T_GEMALT}
    - area
  # (2) a new, empty encounter file and a new script file on the new header
  - [get_header, {id: "${area.header}"}, hdr]
  - [create_encounter_file, {}, enc]
  - [new_script_file, {kind: script}, geber_datei]
  - - set_header
    - id: "${area.header}"
      header: {Pt: {$base: "${hdr.Pt}", wild_pokemon: "${enc}", script_file_id: "${geber_datei}"}}
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, field: rate, value: 100}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 0, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 0, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 1, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 1, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 2, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 2, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 3, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 3, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 4, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 4, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 5, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 5, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 6, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 6, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 7, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 7, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 8, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 8, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 9, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 9, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 10, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 10, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 11, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 11, field: level, value: "${L_WILD}"}}}]
  # the day and night lists replace slots 2 and 3 by the clock
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: day, slot: 0, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: day, slot: 1, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: night, slot: 0, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: night, slot: 1, field: species, value: "${S_WILD}"}}}]
  # (3) the world: ground GROUND (001c) at height 0 everywhere, the package from the map's header
  - [world_create, {req: {map: "${area.maps.0.2}", fill: "001c"}}, w]
  # the tileset file of the package, then the roles: GRASS 33, WATER 44, WALL 13 below GROUND 28
  - [tileset_save, {package: "${w.tileset}"}]
  - - tileset_edit
    - req:
        package: "${w.tileset}"
        changes:
          - {tile: 33, role: grass, kind: 2, collision: 0}
          - {tile: 44, role: water, kind: 21, collision: 0}
          - {tile: 13, role: wall}
          - {tile: 28, wall: 13}
    - expect: {path: tiles, equals: 4}
  # the cells of gate_world, one stroke (one undo step)
  - - world_edit
    - req:
        map: "${area.maps.0.2}"
        changes:
          - tile: "0021"           # tall grass x 16-28, z 3-10
            cells: [
              [16, 3], [17, 3], [18, 3], [19, 3], [20, 3], [21, 3], [22, 3], [23, 3], [24, 3], [25, 3], [26, 3], [27, 3], [28, 3],
              [16, 4], [17, 4], [18, 4], [19, 4], [20, 4], [21, 4], [22, 4], [23, 4], [24, 4], [25, 4], [26, 4], [27, 4], [28, 4],
              [16, 5], [17, 5], [18, 5], [19, 5], [20, 5], [21, 5], [22, 5], [23, 5], [24, 5], [25, 5], [26, 5], [27, 5], [28, 5],
              [16, 6], [17, 6], [18, 6], [19, 6], [20, 6], [21, 6], [22, 6], [23, 6], [24, 6], [25, 6], [26, 6], [27, 6], [28, 6],
              [16, 7], [17, 7], [18, 7], [19, 7], [20, 7], [21, 7], [22, 7], [23, 7], [24, 7], [25, 7], [26, 7], [27, 7], [28, 7],
              [16, 8], [17, 8], [18, 8], [19, 8], [20, 8], [21, 8], [22, 8], [23, 8], [24, 8], [25, 8], [26, 8], [27, 8], [28, 8],
              [16, 9], [17, 9], [18, 9], [19, 9], [20, 9], [21, 9], [22, 9], [23, 9], [24, 9], [25, 9], [26, 9], [27, 9], [28, 9],
              [16, 10], [17, 10], [18, 10], [19, 10], [20, 10], [21, 10], [22, 10], [23, 10], [24, 10], [25, 10], [26, 10], [27, 10], [28, 10]
            ]
          - tile: "002c"           # water x 2-8, z 24-29
            cells: [
              [2, 24], [3, 24], [4, 24], [5, 24], [6, 24], [7, 24], [8, 24],
              [2, 25], [3, 25], [4, 25], [5, 25], [6, 25], [7, 25], [8, 25],
              [2, 26], [3, 26], [4, 26], [5, 26], [6, 26], [7, 26], [8, 26],
              [2, 27], [3, 27], [4, 27], [5, 27], [6, 27], [7, 27], [8, 27],
              [2, 28], [3, 28], [4, 28], [5, 28], [6, 28], [7, 28], [8, 28],
              [2, 29], [3, 29], [4, 29], [5, 29], [6, 29], [7, 29], [8, 29]
            ]
          - {ramp: e1, cells: [[16, 20], [16, 21], [16, 22]]}   # stair, lower tile
          - {ramp: e1, cells: &treppe_oben [[17, 20], [17, 21], [17, 22]]}    # stair, upper tile
          - {height: 1, cells: *treppe_oben}
          - height: 2              # plateau x 18-22, z 20-22 (16 E)
            cells: [
              [18, 20], [19, 20], [20, 20], [21, 20], [22, 20],
              [18, 21], [19, 21], [20, 21], [21, 21], [22, 21],
              [18, 22], [19, 22], [20, 22], [21, 22], [22, 22]
            ]
          - {permission: "6980", cells: [[12, 21]]}                        # door: behaviour 0x69, blocked
    - expect: {path: cells, equals: 171}
  # the bake as the store holds it: accepted, outdoor light (area data 6, light type 0)
  - - world_bake
    - {map: "${area.maps.0.2}"}
    - expect:
        - {path: ok, equals: true}
        - {path: style, equals: outdoor}
  # derived permissions: grass, water, the plateau's east border, the door's hand value
  - - get_map
    - index: "${area.maps.0.2}"
    - expect:
        - {path: permissions.112, equals: [2, 0]}
        - {path: permissions.770, equals: [21, 0]}
        - {path: permissions.694, equals: [0, 128]}
        - {path: permissions.684, equals: [105, 128]}
  # (4) the gift south of (14, 22) (script 2 of the new script file)
  - - add_event
    - eventFile: "${area.event_file}"
      kind: object
      x: 14
      z: 23
      patch: {graphics_id: 6, movement_type: 15, dir: 0, script: 2, trainer_type: 0, sight: 0}
  # (5) arrival warp 0 (back to the bedroom stairs) on the door, the stairs to the new place
  - [add_event, {eventFile: "${area.event_file}", kind: warp, x: 12, z: 21, patch: {dest_header_id: 415, dest_warp_id: 0}}]
  - [update_event, {eventFile: 394, kind: warp, index: 0, patch: {dest_header_id: "${area.header}", dest_warp_id: 0}}]
  # a text literal needs a saved header that uses the script file (it goes to the header's archive)
  - [save, {}]
  - - save_script
    - file: "${geber_datei}"
      text: |
        script Main #1:
            End

        script Geber #2:
            LockAll
            FacePlayer
            GoToIfSet FLAG_UNUSED_0x0094, label_given
            Message "Hier, nimm das."
            WaitButton
            CloseMessage
            GivePokemon ${S_GIFT}, 100, 0, VAR_RESULT
            SetFlag FLAG_UNUSED_0x0094
            ReleaseAll
            End

        label_given:
            ReleaseAll
            End
build: out.nds
play:
  # day: the clock at noon, the console restarts with it
  - clock 12:00
  - continue
  - expect-map 415
  - walk-to 8 4
  - walk right 1
  - expect-map ${area.header}
  - wait 150
  - where
  # the gift: past the door to (14, 22), face south, talk, through the text
  - walk down 1
  - walk-to 14 22
  - press down:8
  - press a
  - mash a 300
  - shot geschenk
  # stair: ground 0, up the stair onto the plateau 16, back onto the upper stair tile 12, up again
  - walk up 1
  - expect-at 14 21
  - expect-height 0
  - walk right 4
  - expect-at 18 21
  - expect-height 16
  - walk left 1
  - expect-at 17 21
  - expect-height 12 0.1
  - walk right 1
  - expect-at 18 21
  - shot treppe
  # east on the plateau: (22, 21) is blocked (16 E over (23, 21))
  - walk-until-blocked right 8
  - expect-at 21 21
  - shot kante
  # down the stair, along row 25 below the plateau; north, row 22 is blocked: the wall stops at
  # (20, 23) after 2 steps (walk-until-blocked needs at least one step)
  - walk left 6
  - expect-at 15 21
  - walk down 4
  - walk right 5
  - expect-at 20 25
  - walk-until-blocked up 4
  - expect-at 20 23
  - shot tag
  # the water (x 2-8, rows 24-29) west of (11, 25), the tall grass (x 16-28, rows 3-10) north of
  # (16, 11); grass rate 100, every slot S_WILD
  - walk down 2
  - walk left 9
  - expect-at 11 25
  - shot wasser
  - walk up 14
  - walk right 5
  - expect-at 16 11
  - shot wiese
  - walk-until-battle up 12 back-and-forth
  - expect-battle ${S_WILD} ${L_WILD}
  - wait 400
  - shot gras
  # night: the clock at 23:00, the console restarts (the bedroom of the save), the same place again
  - clock 23:00
  - continue
  - expect-map 415
  - walk-to 8 4
  - walk right 1
  - expect-map ${area.header}
  - wait 150
  - walk down 1
  - walk right 2
  - walk down 3
  - walk right 5
  - expect-at 20 25
  - walk-until-blocked up 4
  - expect-at 20 23
  - shot nacht
