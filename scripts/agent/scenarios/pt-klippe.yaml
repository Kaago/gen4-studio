  - expect-at 37 9
  - shot klippe
  - walk down 13
  - expect-at 37 22
  # the gift: to (46, 22), face south, talk, through the text
  - walk-to 46 22
  - press down:8
  - press a
  - mash a 300
  - shot geschenk
  # stair: ground 0, up the stair onto the plateau 16, back onto the upper stair tile 12, up again
  - walk up 1
  - expect-at 46 21
  - expect-height 0
  - walk right 4
  - expect-at 50 21
  - expect-height 16
  - walk left 1
  - expect-at 49 21
  - expect-height 12 0.1
  - walk right 1
  - expect-at 50 21
