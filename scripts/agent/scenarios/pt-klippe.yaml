# Platin DE, phase 6.4b (smart drawing): pt-gemalt.yaml of 6.4a, unchanged in its preparation,
# recipe, tileset roles, strokes, door and gift, plus an edge set, a terrain stroke and a cliff stroke
# painted over MCP the way the studio's terrain and cliff brushes paint them, baked by the studio,
# built and walked in the game: the cliff's rim blocks by the edge rule (`walk-until-blocked` stops in
# front of the rim) and the wall is looked at (`shot klippe`).
#
# What 6.4b adds after the eight painted strokes of 6.4a:
#   - `tileset_edit` (g4_call) on the package of the painted map: tiles 64-76 (0040-004c)
#     become plain ground (role ground, kind 0, collision 0) and carry the edge set „Gate“: outside
#     the ground tile GROUND 28 (001c), the 13 places of `Place::GATE13` (center, n, e, s, w,
#     outer_nw, outer_ne, outer_sw, outer_se, inner_nw, inner_ne, inner_sw, inner_se) in that order
#     on 0040 to 004c; no `block` (default „obere Zelle“: a cliff's rim, the upper cell of each
#     high edge, is blocked). The 13 tiles avoid GROUND, GRASS 33, WATER 44 and WALL 13 of
#     6.4a (a token stands once in a set, and the roles of 6.4a stay).
#   - a curated `world_edit` with `terrain` (the terrain brush, „Gelände gemalt“) over the rectangle
#     x 2-8, z 12-16 (35 cells, layer 0) and one with `cliff {height: 2}` (the cliff brush, „Klippe
#     gesetzt“, step 2 = 16 E as the plateau of 6.4a) on x 2-8, z 4-8 (35 cells): west of the stair
#     and plateau (x 16-22, z 20-22), north of the water (z 24-29), west of the grass (x 16-28), away
#     from the door (12, 21) and the gift (14, 23). Two strokes = two more history entries (ten
#     `world_edit` in all), each baked in its step; `world_get` checks the bake (`bake.ok`).
#
# The tile indices are fixed here (as GROUND, GRASS, WATER and WALL are): `--set` passes one scalar,
# and a placeholder that is a whole four-digit token ("0040") becomes a number, so the 13 indices
# cannot come in as one `--set GATE_TILES=…` without a change to g4emu.
#
# Coordinates (painted map cells (x, z), 0-31; in the game x + 32, z unchanged):
#   cliff x 2-8, z 4-8   -> game x 34-40, z 4-8; its rim (border cells, height 2) blocks, its
#                           south rim row is z 8, the ring row below it z 9 is free (block upper)
#   terrain x 2-8, z 12-16 -> game x 34-40, z 12-16 (flat, all 13 tiles plain ground: walkable)
#   column x 37 = map x 5, the middle of both rectangles
# Play after the arrival on the door (44, 21): the player steps east by itself to (45, 21);
# `walk down 1` to (45, 22) (row 22: the door's warp (44, 21) is not stepped on), `walk left
# 8` to (37, 22), then north `walk-until-blocked up 16`: rows 21 to 9 are open (13 steps, the
# terrain rows 16-12 among them), (37, 8) is the cliff's rim -> `expect-at 37 9`, facing north onto
# wall and rim: `shot klippe`. Back `walk down 13` to (37, 22) and `walk-to 46 22`, where 6.4a goes
# on with the gift; the rest of the play is that of pt-gemalt.yaml.
#
# Placeholders as in pt-gemalt.yaml (all required, --set NAME=VALUE): BASIS, NEUER_HEADER
# (593 on an unmodified Platin DE), S_WILD, L_WILD, S_GIFT. Example (from scripts/g4emu, see the head
# of pt-gemalt.yaml and docs/agent-gate.md for the worktree environment):
#   uv run g4emu scenario ../agent/scenarios/pt-klippe.yaml \
#     --project $G4_ROMS_DIR/_testkopien/6-4b-szen-pt_DSPRE_contents \
#     --out $W/target/agent/gate-2026-11-08/6-4b/pt-klippe --set BASIS=../6-4b-szen-pt.nds \
#     --set NEUER_HEADER=593 --set S_WILD=150 --set L_WILD=5 --set S_GIFT=445
# A copy that ran past the build is saved and built: every run needs a fresh copy.
#
# The head of pt-gemalt.yaml (6.4a), unchanged:
#
# Platin DE, phase gate 6 (agent part of gate 6.4a): a NEW map painted over MCP the way the studio
# paints it, baked by the studio, built and walked in the game: the stair works (`expect-height`),
# the wall blocks (`walk-until-blocked`), the grass gives a wild battle (`expect-battle`), the
# outdoor light is looked at by day (`shot tag`) and by night (`shot nacht`).
#
# What 6.4a changes against 6.3b: headless over `studio mcp` (`mcp: [--allow-irreversible,
# --expert]`) instead of the bridge; no `world_create` on the area's own map, but the recipe
# `new_painted_map` („Neue Karte malen“) in the cell EAST of the 1x1 area (the matrix grows to 2x1,
# `report.width` 2), with the ground tile as `fill_tile`; the cells no longer as one list, but as
# one curated `world_edit` per stroke with the label of the paint tool (brush, fill, rectangle, three
# height strokes, ramp, the door's hand value: eight history entries); `world_get` checks the bake
# (`bake.ok`) instead of `world_bake`; the door warp and the gift are added where 6.3b put them and
# moved 32 tiles east by `update_event` into the painted map (as the agent does after painting in
# the browser, pt-gemalt-ui.yaml); the play steps are those of 6.3b with x + 32.
#
# The project becomes a text project first (`assign_base` with the .nds beside the copy,
# `adopt_text_project`, which adopts the scripts too). The place is a 1x1 area on a NEW header from
# Route 201 map 5 (matrix 0 cell (3, 26), template header 342, area data 6, map texture pack 6) with
# a new event file (`create_area`, internal name T_GEMALT, the copied buildings cleared); its header
# gets a new encounter file (grass rate 100, all 12 grass slots and the day/night lists S_WILD at
# L_WILD) and a new script file whose script 1 is empty and script 2 the gift (S_GIFT at level 100,
# once, by a flag; the save has no Pokémon). The bedroom stairs (header 415, event file 394, warp 0)
# lead to the new header's warp 0.
#
# The painted world (cells (x, z) of the painted map, 0-31; in the game x + 32):
#   | Area                  | x     | z     | tile   | height (steps) | ramp | permission     |
#   |-----------------------|-------|-------|--------|----------------|------|----------------|
#   | ground                | rest  | rest  | GROUND | 0              | .    | derived        |
#   | tall grass (fill)     | 16-28 | 3-10  | GRASS  | 0              | .    | derived [2, 0] |
#   | water (rectangle)     | 2-8   | 24-29 | WATER  | 0              | .    | derived [21,0] |
#   | brush line            | 25-30 | 27-29 | GRASS  | 0              | .    | derived [2, 0] |
#   | stair, lower tile     | 16    | 20-22 | GROUND | 0              | e1   | derived        |
#   | stair, upper tile     | 17    | 20-22 | GROUND | 1              | e1   | derived        |
#   | plateau 16 E          | 18-22 | 20-22 | GROUND | 2 (+1, +1)     | .    | derived        |
#   | door (arrival, warp 0)| 12    | 21    | GROUND | 0              | .    | hand 6980      |
#   | gift (figure)         | 14    | 23    | GROUND | 0              | .    | derived        |
# Tiles of the derived tileset of pack 6 (indices only, chosen in 6.3b by looking at
# get_tileset_texture): GROUND 28 = 001c (light green, plain), GRASS 33 = 0021 (green with light
# patches), WATER 44 = 002c (blue waves), WALL 13 (brown rock). `tileset_save` writes the tileset
# file, `tileset_edit` makes GRASS role grass, kind 2, collision 0; WATER role water, kind 21
# (0x15), collision 0; WALL role wall; GROUND gets the wall tile (the walls below a ground cell take
# WALL's texture). Derived collision: an edge of 16 E or more blocks the higher cell, so of the
# plateau only the inner cells of row 21 are open; the stair's edges are 8 E at most (open). get_map
# of the painted map shows it at permissions index z * 32 + x: grass (16, 3) 112 = [2, 0], water (2,
# 24) 770 = [21, 0], plateau border (22, 21) 694 = [0, 128], door (12, 21) 684 = [105, 128].
#
# Play (tiles absolute in the 2x1 matrix, the painted map from x 32): `clock 12:00`, down the stairs
# to the door (44, 21) (the player steps east by itself to (45, 21)), the gift (46, 23) talked to
# from (46, 22); the stair: 0 on (46, 21), 16 on the plateau (50, 21), back onto the upper stair
# tile 12 (49, 21), up again; east on the plateau stops at (53, 21); down the stair and along row 25
# to (52, 25), north against the plateau's wall stops at (52, 23): `shot tag`; `shot wasser` at (43,
# 25), `shot wiese` at (48, 11); then into the grass for the battle. Then `clock 23:00`, `continue`
# (the bedroom again, the save was never written), the same way to the wall and `shot nacht`. The
# clock step: pt-gemalt.yaml of 6.3b (melonDS DS start time, `continue` after it).
#
# Placeholders (all required, passed with --set NAME=VALUE):
#   BASIS         the .nds beside the copy, relative to the project folder (../<copy>.nds)
#   NEUER_HEADER  id the new header gets = the header count before (593 on an unmodified Platin DE)
#   S_WILD L_WILD wild species and level (150 Mewtu, 5)
#   S_GIFT        the gift, level 100 (445 Knakrack)
# Names an edit binds come from the tools' answers (structuredContent.result): area (create_area),
# hdr, enc, geber_datei, p (recipe_apply: report.map 667, report.tileset 6). Example (from
# scripts/g4emu; in a worktree set G4_ROMS_DIR (absolute), G4_STUDIO_BIN and G4K_BIN to
# target/debug/studio and target/debug/g4k after `cargo build --workspace --all-features`, see
# docs/agent-gate.md, "Szenarien über MCP"):
#   uv run g4emu scenario ../agent/scenarios/pt-gemalt.yaml \
#     --project $G4_ROMS_DIR/_testkopien/6-4a-szen-pt_DSPRE_contents \
#     --out $W/target/agent/gate-$(date +%F)/6-4a/pt-gemalt --set BASIS=../6-4a-szen-pt.nds \
#     --set NEUER_HEADER=593 --set S_WILD=150 --set L_WILD=5 --set S_GIFT=445
# A copy that ran past the build is saved and built: every run needs a fresh copy.
game: CPUD
# --expert: create_encounter_file, new_script_file, tileset_save, tileset_edit and get_map are no
# curated tools (g4_call); --allow-irreversible: the patch, the new files and new_painted_map
mcp: [--allow-irreversible, --expert]
edits:
  # (1) base ROM, patch, text project (adopts the scripts), the new place
  - [assign_base, {nds: "${BASIS}"}]
  - [apply_header_patch, {}]
  - [adopt_text_project, {}]
  - - create_area
    - spec:
        name: Gemalt
        width: 1
        height: 1
        cells:                       # Route 201 (header 342): matrix 0 cell (3, 26) = map 5
          - {x: 0, y: 0, source_map: 5, clear_buildings: true}
        with_headers: true
        header:
          id: "${NEUER_HEADER}"
          area_data_id: null
          event_file: New
          new_header: {template: 342, internal_name: T_GEMALT}
    - area
  # (2) a new, empty encounter file and a new script file on the new header
  - [get_header, {id: "${area.header}"}, hdr]
  - [g4_call, {command: create_encounter_file}, enc]
  - [g4_call, {command: new_script_file, args: {kind: script}}, geber_datei]
  - - set_header
    - id: "${area.header}"
      header: {Pt: {$base: "${hdr.Pt}", wild_pokemon: "${enc}", script_file_id: "${geber_datei}"}}
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, field: rate, value: 100}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 0, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 0, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 1, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 1, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 2, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 2, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 3, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 3, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 4, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 4, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 5, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 5, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 6, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 6, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 7, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 7, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 8, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 8, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 9, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 9, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 10, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 10, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 11, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 11, field: level, value: "${L_WILD}"}}}]
  # the day and night lists replace slots 2 and 3 by the clock
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: day, slot: 0, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: day, slot: 1, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: night, slot: 0, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: night, slot: 1, field: species, value: "${S_WILD}"}}}]
  # (4) the gift south of (14, 22) (script 2 of the new script file)
  - - add_event
    - event_file: "${area.event_file}"
      kind: object
      x: 14
      z: 23
      patch: {graphics_id: 6, movement_type: 15, dir: 0, script: 2, trainer_type: 0, sight: 0}
  # (5) arrival warp 0 (back to the bedroom stairs) on the door, the stairs to the new place
  - [add_event, {event_file: "${area.event_file}", kind: warp, x: 12, z: 21, patch: {dest_header_id: 415, dest_warp_id: 0}}]
  - [update_event, {event_file: 394, kind: warp, index: 0, patch: {dest_header_id: "${area.header}", dest_warp_id: 0}}]
  # a text literal needs a saved header that uses the script file (it goes to the header's archive)
  - [save, {}]
  - - save_script
    - file: "${geber_datei}"
      text: |
        script Main #1:
            End

        script Geber #2:
            LockAll
            FacePlayer
            GoToIfSet FLAG_UNUSED_0x0094, label_given
            Message "Hier, nimm das."
            WaitButton
            CloseMessage
            GivePokemon ${S_GIFT}, 100, 0, VAR_RESULT
            SetFlag FLAG_UNUSED_0x0094
            ReleaseAll
            End

        label_given:
            ReleaseAll
            End
  # (6) the painted map: the 1x1 matrix of create_area grows east (cell (1, 0)), the new map copies
  # the neighbour without buildings and gets a blank world on the neighbour's package, ground
  # 001c at height 0; the cell takes the neighbour's header (area.header)
  - - recipe_apply
    - recipe: new_painted_map
      input: {matrix: "${area.matrix}", x: 1, y: 0, name: Malweg, fill_tile: "001c"}
    - expect:
        - {path: report.width, equals: 2}
        - {path: report.tileset, equals: 6}
        - {path: report.header, equals: "${area.header}"}
      as: p
  # the tileset file of the package, then the roles (as in 6.3b)
  - [g4_call, {command: tileset_save, args: {package: "${p.report.tileset}"}}]
  - - g4_call
    - command: tileset_edit
      args:
        req:
          package: "${p.report.tileset}"
          changes:
            - {tile: 33, role: grass, kind: 2, collision: 0}
            - {tile: 44, role: water, kind: 21, collision: 0}
            - {tile: 13, role: wall}
            - {tile: 28, wall: 13}
    - expect: {path: tiles, equals: 4}
  # the strokes as the paint tool sends them (apps/studio/src/world/paint/ops.ts strokeRequest and
  # strokeLabel; the label pads the map to four digits, the map index has three: "Karte 0${…}"),
  # one world_edit = one undo step and one history entry each, every one baked in its step
  # (the label prefix "0" assumes a three-digit map index, 667 | 677 here; a four-digit map would
  # need it dropped)
  # brush: a short line of tall grass from (25, 27) to (30, 29), the cells of a Bresenham line, in
  # the south-east corner away from every play path and checked permission
  - - world_edit
    - req:
        map: "${p.report.map}"
        label: "Gemalt: Karte 0${p.report.map} (6 Zellen)"
        changes:
          - layer: 0
            tile: "0021"
            cells: [[25, 27], [26, 27], [27, 28], [28, 28], [29, 29], [30, 29]]
    - expect: {path: cells, equals: 6}
  # fill: tall grass x 16-28, z 3-10. On a blank map the fill tool floods all 1024 cells; these 104
  # cells stand for a fill of an enclosed region (the rectangle the 6.3b world has), sent as the
  # tool would send that region
  - - world_edit
    - req:
        map: "${p.report.map}"
        label: "Gefüllt: Karte 0${p.report.map} (104 Zellen)"
        changes:
          - layer: 0
            tile: "0021"
            cells: [
              [16, 3], [17, 3], [18, 3], [19, 3], [20, 3], [21, 3], [22, 3], [23, 3], [24, 3], [25, 3], [26, 3], [27, 3], [28, 3],
              [16, 4], [17, 4], [18, 4], [19, 4], [20, 4], [21, 4], [22, 4], [23, 4], [24, 4], [25, 4], [26, 4], [27, 4], [28, 4],
              [16, 5], [17, 5], [18, 5], [19, 5], [20, 5], [21, 5], [22, 5], [23, 5], [24, 5], [25, 5], [26, 5], [27, 5], [28, 5],
              [16, 6], [17, 6], [18, 6], [19, 6], [20, 6], [21, 6], [22, 6], [23, 6], [24, 6], [25, 6], [26, 6], [27, 6], [28, 6],
              [16, 7], [17, 7], [18, 7], [19, 7], [20, 7], [21, 7], [22, 7], [23, 7], [24, 7], [25, 7], [26, 7], [27, 7], [28, 7],
              [16, 8], [17, 8], [18, 8], [19, 8], [20, 8], [21, 8], [22, 8], [23, 8], [24, 8], [25, 8], [26, 8], [27, 8], [28, 8],
              [16, 9], [17, 9], [18, 9], [19, 9], [20, 9], [21, 9], [22, 9], [23, 9], [24, 9], [25, 9], [26, 9], [27, 9], [28, 9],
              [16, 10], [17, 10], [18, 10], [19, 10], [20, 10], [21, 10], [22, 10], [23, 10], [24, 10], [25, 10], [26, 10], [27, 10], [28, 10]
            ]
    - expect: {path: cells, equals: 104}
  # rectangle: water x 2-8, z 24-29
  - - world_edit
    - req:
        map: "${p.report.map}"
        label: "Rechteck gemalt: Karte 0${p.report.map} (42 Zellen)"
        changes:
          - layer: 0
            tile: "002c"
            cells: [
              [2, 24], [3, 24], [4, 24], [5, 24], [6, 24], [7, 24], [8, 24],
              [2, 25], [3, 25], [4, 25], [5, 25], [6, 25], [7, 25], [8, 25],
              [2, 26], [3, 26], [4, 26], [5, 26], [6, 26], [7, 26], [8, 26],
              [2, 27], [3, 27], [4, 27], [5, 27], [6, 27], [7, 27], [8, 27],
              [2, 28], [3, 28], [4, 28], [5, 28], [6, 28], [7, 28], [8, 28],
              [2, 29], [3, 29], [4, 29], [5, 29], [6, 29], [7, 29], [8, 29]
            ]
    - expect: {path: cells, equals: 42}
  # height +1 on the plateau x 18-22, z 20-22 (step 1), again (step 2 = 16 E), +1 on the upper
  # stair column x 17 (step 1); a height stroke sends the target step
  - - world_edit
    - req:
        map: "${p.report.map}"
        label: "Höhe geändert: Karte 0${p.report.map} (15 Zellen)"
        changes:
          - height: 1
            cells: [
              [18, 20], [19, 20], [20, 20], [21, 20], [22, 20],
              [18, 21], [19, 21], [20, 21], [21, 21], [22, 21],
              [18, 22], [19, 22], [20, 22], [21, 22], [22, 22]
            ]
    - expect: {path: cells, equals: 15}
  - - world_edit
    - req:
        map: "${p.report.map}"
        label: "Höhe geändert: Karte 0${p.report.map} (15 Zellen)"
        changes:
          - height: 2
            cells: [
              [18, 20], [19, 20], [20, 20], [21, 20], [22, 20],
              [18, 21], [19, 21], [20, 21], [21, 21], [22, 21],
              [18, 22], [19, 22], [20, 22], [21, 22], [22, 22]
            ]
    - expect: {path: cells, equals: 15}
  - - world_edit
    - req:
        map: "${p.report.map}"
        label: "Höhe geändert: Karte 0${p.report.map} (3 Zellen)"
        changes:
          - {height: 1, cells: [[17, 20], [17, 21], [17, 22]]}
    - expect: {path: cells, equals: 3}
  # ramp e1 (uphill east, one step) on the stair x 16-17, z 20-22
  - - world_edit
    - req:
        map: "${p.report.map}"
        label: "Rampe gesetzt: Karte 0${p.report.map} (6 Zellen)"
        changes:
          - {ramp: e1, cells: [[16, 20], [17, 20], [16, 21], [17, 21], [16, 22], [17, 22]]}
    - expect: {path: cells, equals: 6}
  # the door's hand value (behaviour 0x69, blocked): the paint tool has no permission sub-tool, so no
  # label (the kernel's default "Welt geändert: Karte NNNN (1 Zelle)")
  - - world_edit
    - req:
        map: "${p.report.map}"
        changes:
          - {permission: "6980", cells: [[12, 21]]}
    - expect: {path: cells, equals: 1}
  # 6.4b: the edge set „Gate“ on 0040-004c (the 13 tiles plain ground), outside GROUND
  - - g4_call
    - command: tileset_edit
      args:
        req:
          package: "${p.report.tileset}"
          changes:
