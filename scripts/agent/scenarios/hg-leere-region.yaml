# HeartGold DE (Gate 3g.2): the template "Leere Region mit Startstadt" on a fresh copy, then a NEW
# game without a save: intro, room, mother (Pokégear), out of the door into Neuborkia (header 60),
# the start script gives Endivie (152) Lv. 5 and the Pokédex, the team shows it, and the way west
# ends at the border map (no Route 29 any more, the header stays 60). Neuborkia's north is trees,
# so the border is proved to the west.
#
# No placeholders. The copy must come from `g4k create <rom> <kopie>` (template original) and is
# saved and built by the run: every run needs a fresh copy.
#
# Example (from scripts/g4emu, G4_ROMS_DIR absolute when run from a worktree):
#   uv run g4emu scenario ../agent/scenarios/hg-leere-region.yaml \
#     --project /…/Roms/_testkopien/3g-gate-b/hg --out ../../target/agent/gate-$(date +%F)/b2-hg
# Expected header sequence: 64, 63, 60. Frames measured on 2026-10-25 (the run is deterministic).
game: IPKD
edits:
  - [adopt_scripts, {}]
  - [apply_empty_region, {}, {expect: [{path: plan.start_header, equals: 60}]}]
  - [run_checks, {scope: all}, {expect: [{path: "findings[severity=error].length", equals: 0}, {path: groups.length, equals: 3}]}]
build: out.nds
save: none
play:
  - new-game                 # intro from power-on (games.yaml), ends in 64 at x 6, y 6
  - expect-map 64
  - shot zimmer
  - walk-to 3 4
  - walk left 1              # the stairs tile (2, 4)
  - walk down 1
  - expect-map 63
  - wait 150
  - mash b 600               # the mother talks: Prof. Lind, the Pokégear
  - shot mutter
  - mash b 1800              # B closes her texts; the menu on the bottom screen stays untouched
  - walk-to 3 10             # the door
  - walk down 1
  - expect-map 60            # Neuborkia, arrival x 695, y 396
  - wait 70                  # the fade ends at about +65
  - shot ankunft             # banner "Neuborkia", no figures
  - wait 110                 # the start script runs by itself on the first visit (level script, var condition)
  - shot start-script        # "Willkommen in deiner leeren Region! Hier ist dein erstes Pokémon."
  - press a:4
  - wait 60
  - mash b 200
  - wait 120
  - press x:4
  - wait 60
  - shot menue               # POKéDEX and POKéMON in the touch menu, the running-shoe button
  - press down:4
  - wait 10
  - press a:4
  - wait 120
  - shot team                # Endivie Lv. 5
  - press b:4
  - wait 120
  - press b:4                # the menu is closed again
  - wait 60
  - walk down 2              # y 399: an open row to the town's west edge
  - walk-until-blocked left 40 # 23 tiles, blocked at x 672: west lies the border map
  - where
  - expect-map 60
  - shot rand
