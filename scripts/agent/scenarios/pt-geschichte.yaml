# Platin DE, gate 3d.7: a story made headless over MCP (`studio mcp`, one session) from the five
# story recipes, then played end to end. "Neue Geschichte" (new_story) takes a variable from the
# pool and names it VAR_STORY_DER_BRIEF; "Gespräch schaltet weiter" (talk_advances) gives figure A a
# hull script that says a text at step 0 and switches to 1; "Figur erscheint/verschwindet ab
# Schritt" (figure_appears) hangs a pool flag on trainer B (hidden_flag) and switches it in the
# place's on_transition script, so B is there from step 1 on; "Szene beim Betreten" (scene_on_enter)
# puts a var_conditions entry `var == 1` into the room's level script whose scene shows a text and
# switches to 2; "Belohnung einmalig" (reward_once) lets A give a Trank (item 17) once from step 2
# on, remembered by a second pool flag.
#
# The project is set up as a text project first (`assign_base`, `adopt_text_project`, which adopts
# the scripts as well): stories, own names and `free_flag` need it. The place is the one of
# pt-erzaehlen.yaml: a NEW header on copies of the Route 201 maps 5 and 6 (template 342) with a new,
# empty event file, a new script file (script 1 empty, the template's level script runs it on
# entering; the gift is script 2) and a new text archive. The room is a NEW header from the room
# recipe (create_room: a copy of the player's room, map 187, template 415, event file a copy of 394,
# its stairs warp at (8, 4) repointed to the new door outside); it keeps 415's script file and text
# archive (the scene becomes a new slot there and a new message of archive 558), and its level script
# file, which 415 shares, is copied by scene_on_enter (irreversible: `--allow-irreversible`).
#
# Tiles (absolute in the new header's matrix; read from the copy's map 0006, `unpacked/maps/0006`,
# permissions: x 42-52 rows 10-19 tall grass, rows 20-24 plain from x 32 to 53, x 51-52 rows 14-19
# blocked, x 53-54 open from row 24 up to row 17, row 16 blocked there):
#   door (44, 21)     arrival from the bedroom stairs (connect_doors, 415 warp 0, door tiles on);
#                     the player arrives on it and steps east to (45, 21)
#   gift (45, 20)     north of the arrival (S_GIFT at level 100, the trainer battle needs a Pokémon;
#                     the save has none), as in pt-trainer-begegnung.yaml
#   A (X_A, Z_A)      (48, 19): the brief's tile, tall grass, open from the south: the player stands
#                     on plain (48, 20), faces north and talks; nobody steps into the grass
#   B (X_B, Z_B)      (54, 17), looking south, sight 3: column 54 is open from row 21 up to row 17
#                     (row 16 blocked), so with B hidden the walk up from (54, 21) ends on B's tile;
#                     with B there, B sees the player at (54, 20) and the walk stops there
#   room door         (TUER_X, TUER_Z) = (50, 22), plain, south of the way along row 21, door tiles
#                     on. Not the brief's (46, 18): that tile and every way to it is tall grass
#                     (46, 19), and the player leaving the room steps east off the door (as off the
#                     arrival door), onto (47, 18), grass again; a wild battle there would end the
#                     run. (50, 22) has plain ground on all four sides; the player pushes west into
#                     it from (51, 22) (a door is walked into, not onto, as in pt-flag.yaml) and
#                     steps east to (51, 22) when leaving the room.
#
# Play: arrive, gift, variable 0 and B's flag set (the transition block ran: B hidden). Up column 54
# to B's tile (54, 17). A: text, variable 1, `shot gespraech`. Into the room: the scene, `shot
# szene`, variable 2. Out again (B's flag now clear): up column 54, B sees the player at (54, 20),
# `expect-battle`, `win-battle` (the gift at level 100). A again: the reward, `shot belohnung`, flag
# 1. A once more: no second reward (A says the text of new_figure; `shot belohnung-2`), flag still 1.
#
# Edits check: each story recipe is one undo step (history before and after); `free_flag` before and
# after the chain: one variable and two flags fewer in the pool; `story_list` free_vars likewise;
# `story_get` five steps (s0 start, s1 dialog, the appearance at 1, s2 the scene, the reward at 2);
# `run_checks` no error. After the build `g4k text check` (schema current, nothing differs) and
# `g4k check` (no broken warp, no missing script or trainer beyond vanilla).
#
# Placeholders (all required, passed with --set NAME=VALUE):
#   BASIS         the .nds beside the copy, relative to the project folder (../<copy>.nds)
#   NEUER_HEADER  id the new header gets = the header count before (593 on an unmodified Platin DE)
#   RAUM_HEADER   id the room gets = NEUER_HEADER + 1 (594)
#   X_A Z_A       figure A (48, 19)            X_B Z_B  trainer B (54, 17)
#   TUER_X TUER_Z the room's door outside (50, 22)
#   S_GIFT        the gift, level 100 (445 Knakrack)        S_T L_T  B's Pokémon (25 Pikachu, 12)
# Names an edit binds (third element) come from the tools' answers (structuredContent.result).
# Example (from scripts/g4emu; in a worktree set G4_ROMS_DIR, G4_STUDIO_BIN and G4K_BIN, see
# docs/agent-gate.md, "Szenarien über MCP" and "Phase 3d.7"):
#   uv run g4emu scenario ../agent/scenarios/pt-geschichte.yaml \
#     --project $G4_ROMS_DIR/_testkopien/3d-7-szen-pt_DSPRE_contents --set BASIS=../3d-7-szen-pt.nds \
#     --out ../../target/agent/gate-$(date +%F)/3d-7/pt-geschichte \
#     --set NEUER_HEADER=593 --set RAUM_HEADER=594 --set X_A=48 --set Z_A=19 --set X_B=54 --set Z_B=17 \
#     --set TUER_X=50 --set TUER_Z=22 --set S_GIFT=445 --set S_T=25 --set L_T=12
game: CPUD
# --expert: new_script_file and create_text_archive are no curated tools (g4_call)
mcp: [--allow-irreversible, --expert]
edits:
  # (1) base ROM (a text project needs it), patch, text project (adopts the scripts), the new place
  - [assign_base, {nds: "${BASIS}"}]
  - [apply_header_patch, {}]
  - [adopt_text_project, {}]
  - - create_area
    - spec:
        name: Geschichte
        width: 2
        height: 1
        cells:                       # Route 201 (header 342): matrix 0 cells (3, 26) = map 5 and (4, 26) = map 6
          - {x: 0, y: 0, source_map: 5, clear_buildings: false}
          - {x: 1, y: 0, source_map: 6, clear_buildings: false}
        with_headers: true
        header:
          id: "${NEUER_HEADER}"
          area_data_id: null
          event_file: New
          new_header: {template: 342, internal_name: T_GESCHICHTE}
    - area
  # (2) a new script file and a new text archive on the new header, saved (a text literal and the
  # recipes' compiles find the archive through the saved header)
  - [get_header, {id: "${area.header}"}, hdr]
  - [g4_call, {command: new_script_file, args: {kind: script}}, datei]
  - [g4_call, {command: create_text_archive}, archiv]
  - - set_header
    - id: "${area.header}"
      header: {Pt: {$base: "${hdr.Pt}", script_file_id: "${datei}", text_archive_id: "${archiv}"}}
  - [save, {}]
  # (3) the gift (script 2; no flag: it is talked to once, with B, so A never asks again)
  - - save_script
    - file: "${datei}"
      text: |
        script Main #1:
            End

        script Geber #2:
            LockAll
            FacePlayer
            Message "Hier, nimm das."
            WaitButton
            CloseMessage
            GivePokemon ${S_GIFT}, 100, 0, VAR_RESULT
            ReleaseAll
            End
  - - add_event
    - event_file: "${area.event_file}"
      kind: object
      x: 45
      z: 20
      patch: {graphics_id: 6, movement_type: 15, dir: 1, script: 2, trainer_type: 0, sight: 0}
  # (4) the bedroom stairs to a new door on the place and back, figure A, trainer B, the room
  - - recipe_apply
    - recipe: connect_doors
      input: {a: {header: 415, warp: 0}, b: {header: "${area.header}", tile: {x: 44, z: 21}}, back: true, door_tiles: true}
  - - recipe_apply
    - recipe: new_figure
      input: {header: "${area.header}", x: "${X_A}", z: "${Z_A}", graphics_id: 6, movement_type: 15, dir: 1, text: "Hallo, Reisender!"}
    - figur
  - - recipe_apply
    - recipe: new_trainer_here
      input:
        header: "${area.header}"
        x: "${X_B}"
        z: "${Z_B}"
        dir: 1
        sight: 3
        class: 9
        name: Jens
        party: [{species: "${S_T}", level: "${L_T}"}]
        texts: {before: 'Halt! Ich bin Jens!\r', lose: 'Du bist stark!', after: 'Gut gekämpft.'}
        graphics_id: 20
    - trainer
  # B's local id: the third object of the new event file (gift, A, B)
  - - get_events
    - {event_file: "${area.event_file}"}
    - expect:
        - {path: objects.length, equals: 3}
        - {path: objects.2.script, equals: "${trainer.report.script}"}
      as: ev
  - - recipe_apply
    - recipe: create_room
      input:
        name: Haus der Geschichte
        source_map: 187
        clear_buildings: false
        header:
          id: "${RAUM_HEADER}"
          area_data_id: null
          event_file: {Copy: 394}
          new_header: {template: 415, internal_name: R_GESCHICHTE}
        entrance: {outside_header: "${area.header}", x: "${TUER_X}", z: "${TUER_Z}", inside_x: 8, inside_z: 4, door_tiles: true}
    - expect:
        - {path: report.inside_warp_reused, equals: true}
        - {path: report.door_tiles.length, equals: 1}
      as: raum
  - [save, {}]
  # (5) the story, five recipes; free numbers from the pool first
  - [free_flag, {kind: var}, v0]
  - [free_flag, {kind: flag}, f0]
  - [history, {}, h0]
  - - recipe_apply
    - recipe: new_story
      input: {name: Der Brief, var: "${v0.number}"}
    - story
  - [history, {}, {expect: [{path: undo.length, equals: "${h0.undo.length+1}"}], as: h1}]
  - - recipe_apply
    - recipe: talk_advances
      input: {story: "${story.report.story}", figure: {header: "${area.header}", local_id: "${figur.report.local_id}"}, from_step: 0, text: "Bring den Brief ins Haus!"}
    - gespraech
  - [history, {}, {expect: [{path: undo.length, equals: "${h1.undo.length+1}"}], as: h2}]
  - - recipe_apply
    - recipe: figure_appears
      input: {story: "${story.report.story}", figure: {header: "${area.header}", local_id: "${ev.objects.2.local_id}"}, step: 1, appears: true, flag: "${f0.number}"}
    - erscheint
  - [history, {}, {expect: [{path: undo.length, equals: "${h2.undo.length+1}"}], as: h3}]
  - - recipe_apply
    - recipe: scene_on_enter
      input: {story: "${story.report.story}", header: "${RAUM_HEADER}", step: 1, text: "Der Brief ist angekommen."}
    - szene
  - [history, {}, {expect: [{path: undo.length, equals: "${h3.undo.length+1}"}], as: h4}]
  - [free_flag, {kind: flag}, f1]
  - - recipe_apply
    - recipe: reward_once
      input: {story: "${story.report.story}", figure: {header: "${area.header}", local_id: "${figur.report.local_id}"}, from_step: 2, item: 17, text: "Danke! Nimm das.", flag: "${f1.number}"}
    - belohnung
  - [history, {}, {expect: [{path: undo.length, equals: "${h4.undo.length+1}"}]}]
  # (6) the pool: one variable and two flags fewer; the story: five steps, its variable
  - [free_flag, {kind: var}, {expect: [{path: pool_free, equals: "${v0.pool_free-1}"}]}]
  - [free_flag, {kind: flag}, {expect: [{path: pool_free, equals: "${f0.pool_free-2}"}]}]
  - - story_list
    - {}
    - expect:
        - {path: stories.length, equals: 1}
        - {path: stories.0.steps, equals: 5}
        - {path: free_vars, equals: "${v0.pool_free-1}"}
  - - story_get
    - {id: "${story.report.story}"}
    - expect:
        - {path: progress_number, equals: "${v0.number}"}
        - {path: story.steps.length, equals: 5}
        - {path: "story.steps[key=s0].0.kind", equals: start}
        - {path: "story.steps[key=s1].0.kind", equals: dialog}
        - {path: "story.steps[key=s2].0.kind", equals: dialog}
        - {path: "story.steps[kind=appearance].0.value", equals: 1}
        - {path: "story.steps[kind=reward].0.value", equals: 2}
  - - run_checks
    - {scope: all}
    - expect:
        - {path: "findings[severity=error].length", equals: 0}
build: build/out.nds
check:
  - [g4k, text, check, .]
  # event.script-missing 1: vanilla Platin, sign 1 of event file 0044 calls #45 of script file 0050
  - [g4k, check, ., --expect, warp.dest-warp=0, --expect, event.script-missing=1,
     --expect, event.trainer-missing=0]
play:
  - continue
  - expect-map 415
  - walk-to 8 4
  - walk right 1
  - expect-map ${area.header}
  - wait 150
  - where
  # the gift: face north, talk, B through the text (A would talk again)
  - press up:8
  - press a
  - mash b 300
  - shot geschenk
  # step 0: B is hidden (the transition block set its flag), the way up column X_B goes onto its tile
  - expect-var ${v0.number} 0
  - expect-flag ${f0.number} 1
  - walk-to ${X_B} 21
  - walk-until-blocked up 6
  - expect-at ${X_B} ${Z_B}
  # A at step 0: the talk text, then step 1
  - walk-to ${X_B} 21
  - walk-to ${X_A} ${Z_A+1}
  - press up:8
  - press a
  - wait 90
  - shot gespraech
  - mash b 120
  - expect-var ${v0.number} 1
  # the room at step 1: the scene, then step 2
  - walk-to ${TUER_X+1} ${TUER_Z}
  - press left:30
  - expect-map ${RAUM_HEADER}
  - wait 150
  - shot szene
  - mash b 120
  - expect-var ${v0.number} 2
  # out again: B is there now; it sees the player on the way up column X_B and battles
  - walk-to 8 4
  - walk right 1
  - expect-map ${area.header}
  - wait 150
  - where
  - expect-flag ${f0.number} 0
  - walk-to ${X_B} 21
  - walk-until-blocked up 6
  - expect-at ${X_B} ${Z_B+3}
  - mash a 240
  - expect-battle ${S_T} ${L_T} 900
  - wait 300                                # "Eine Herausforderung von Wanderer Jens!"
  - shot kampf
  - win-battle
  - wait 120
  - press b
  - expect-map ${area.header}
  # A at step 2: the reward once
  - walk-to ${X_A} ${Z_A+1}
  - press up:8
  - press a
  - wait 90
  - shot belohnung
  - mash b 300
  - expect-flag ${f1.number} 1
  - expect-var ${v0.number} 2
  # A again: no second reward, A says its own text (new_figure)
  - press a
  - wait 90
  - shot belohnung-2
  - mash b 120
  - expect-flag ${f1.number} 1
