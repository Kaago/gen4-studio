# HeartGold DE, gate 3d.1: a free flag gets its own name and hides a figure once the player has
# talked to it, proved in the game by reading the flag from the save block in RAM (`expect-flag`)
# and by walking through the tile where the figure stood. Headless over MCP (`studio mcp`, one
# session). The HeartGold twin of pt-flag.yaml.
#
# The project is set up as a text project first (`adopt_text_project`, which adopts the scripts as
# well): the own name FLAG_SZENARIO_FIGUR goes to data/ids/flags.json, data/flags/NNNN.json and
# rotom's id files, so the script `SetFlag FLAG_SZENARIO_FIGUR` compiles. `free_flag` takes the
# smallest free number of the general area (bound as frei), `name_flag` names it. The script uses
# the HeartGold names of the message commands (NPCMsg, CloseMsg); SetFlag is the same in both
# families.
#
# The new place is the one of hg-trainer-begegnung.yaml: a NEW header on a copy of the Route 29
# map 1 (template 33) with a new event file and a new script file (script 1 empty, the template's
# level script 470 runs it on entering; script 2 the figure); the bedroom stairs (event file 61,
# warp 0, header 64; normally to 63) lead there, the arrival is a door at (24, 16) and the player
# steps west off it to (23, 16). North of the arrival lies tall grass (x 16-29, rows 13-15), so the
# figure stands west of it on plain ground: x 15 is open from row 16 up to row 13 and blocked at
# row 12 (collision 0x80), read from the copy's map 0001 (`unpacked/maps/0001`, permissions; the
# area is one map, its coordinates are the map's). The figure at (X_FIGUR, Z_FIGUR) = (15, 13) has
# hidden_flag = the free number, so it shows while the flag is 0 and is gone once the flag is set
# and the map loads again.
#
# Play: arrive, flag 0, walk west along row 16 and up from (15, 16): blocked by the figure, the
# player stops at (15, 14). Talk (script 2 sets the flag), flag 1. Back through the door (push east
# into it from (23, 16): a door is walked into, not onto) to 64, down the stairs again, flag still
# 1, and the same walk up now goes one tile further, to (15, 13) where the figure stood.
#
# Placeholders (all required, passed with --set NAME=VALUE):
#   BASIS         the .nds beside the copy, relative to the project folder (../<copy>.nds): the
#                 base ROM that adopt_text_project needs (assign_base)
#   NEUER_HEADER  id the new header gets = the header count before (540 on an unmodified HeartGold DE)
#   X_FIGUR Z_FIGUR  the figure's tile (15, 13); the stops below are (X_FIGUR, Z_FIGUR + 1) and
#                 (X_FIGUR, Z_FIGUR), with Z_FIGUR + 1 written as `${Z_FIGUR+1}`
# Names an edit binds (third element) come from the tools' answers (structuredContent.result): area
# (create_area), hdr, datei, frei (free_flag: number, name, pool_free).
# Example (from scripts/g4emu; in a worktree set G4_ROMS_DIR, G4_STUDIO_BIN and G4K_BIN, see
# docs/agent-gate.md, "Szenarien über MCP"):
#   uv run g4emu scenario ../agent/scenarios/hg-flag.yaml \
#     --project $G4_ROMS_DIR/_testkopien/3d-1-szen-hg_DSPRE_contents --set BASIS=../3d-1-szen-hg.nds \
#     --out ../../target/agent/gate-$(date +%F)/3d-1/hg-flag \
#     --set NEUER_HEADER=540 --set X_FIGUR=15 --set Z_FIGUR=13
game: IPKD
# --expert: new_script_file and set_permission are no curated tools, they go through g4_call
mcp: [--allow-irreversible, --expert]
edits:
  # (1) base ROM (a text project needs it), patch, text project (adopts the scripts), the new place
  - [assign_base, {nds: "${BASIS}"}]
  - [apply_header_patch, {}]
  - [adopt_text_project, {}]
  - - create_area
    - spec:
        name: Flag-Szenario
        width: 1
        height: 1
        cells:                       # Route 29 (header 33): matrix 0 cell (18, 12) = map 1
          - {x: 0, y: 0, source_map: 1, clear_buildings: false}
        with_headers: true
        header:
          id: "${NEUER_HEADER}"
          area_data_id: null
          event_file: New
          new_header: {template: 33, internal_name: T_FLAG}
    - area
  # (2) a new script file on the new header
  - [get_header, {id: "${area.header}"}, hdr]
  - [g4_call, {command: new_script_file, args: {kind: script}}, datei]
  - - set_header
    - id: "${area.header}"
      header: {HGSS: {$base: "${hdr.HGSS}", script_file_id: "${datei}"}}
  # (3) a free flag with its own name
  - [free_flag, {kind: flag}, frei]
  - [name_flag, {kind: flag, number: "${frei.number}", id: FLAG_SZENARIO_FIGUR, description: "Figur im Szenario"}]
  # (4) the figure (script 2, graphics 317 as the gift of hg-trainer-begegnung), hidden while the
  # flag is set
  - - add_event
    - event_file: "${area.event_file}"
      kind: object
      x: "${X_FIGUR}"
      z: "${Z_FIGUR}"
      patch: {graphics_id: 317, movement_type: 15, dir: 1, script: 2, trainer_type: 0, sight: 0, hidden_flag: "${frei.number}"}
  # (5) arrival warp 0 (back to the bedroom stairs) on a door tile (behaviour 0x69, collision 0x80,
  # as the door tool makes it), the stairs to the new place
  - [add_event, {event_file: "${area.event_file}", kind: warp, x: 24, z: 16, patch: {dest_header_id: 64, dest_warp_id: 0}}]
  - [g4_call, {command: set_permission, args: {index: "${area.maps.0.2}", x: 24, y: 16, kind: 105, collision: 128}}]
  - [update_event, {event_file: 61, kind: warp, index: 0, patch: {dest_header_id: "${area.header}", dest_warp_id: 0}}]
  # a text literal needs a saved header that uses the script file (it goes to the header's archive)
  - [save, {}]
  - - save_script
    - file: "${datei}"
      text: |
        script Main #1:
            End

        script Figur #2:
            LockAll
            FacePlayer
            NPCMsg "Bis bald!"
            WaitButton
            CloseMsg
            SetFlag FLAG_SZENARIO_FIGUR
            ReleaseAll
            End
build: build/out.nds
play:
  - continue
  - expect-map 64
  - walk left 1
  - walk down 1
  - expect-map ${area.header}
  - wait 150
  - where
  - expect-flag ${frei.number} 0
  # west along row 16 (plain ground), then up: the figure blocks
  - walk-to ${X_FIGUR} 16
  - walk-until-blocked up 6
  - expect-at ${X_FIGUR} ${Z_FIGUR+1}
  # talk: the script sets the flag
  - press a
  - mash a 240
  - shot gespraech
  - expect-flag ${frei.number} 1
  # back through the door to the bedroom, down the stairs again (the map loads anew)
  - walk-to ${X_FIGUR} 16
  - walk-to 23 16
  - press right:30
  - expect-map 64
  - wait 150
  - walk-to 2 4
  - walk down 1
  - expect-map ${area.header}
  - wait 150
  - expect-flag ${frei.number} 1
  # the figure is gone: the same walk goes one tile further
  - walk-to ${X_FIGUR} 16
  - walk-until-blocked up 6
  - expect-at ${X_FIGUR} ${Z_FIGUR}
  - shot weg
