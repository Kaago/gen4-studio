# Platin DE, gate 3b.3b: two new trainers with one Pokémon each and a new encounter file, on a new
# place, beaten and met in the game. The new place is a NEW header on copies of the Route 201 maps
# 5 and 6 (template 342) with a new event file; the bedroom stairs lead there, the arrival is a door
# at (44, 21) (the player steps east off it to 45, 21). Its header gets a new encounter file (grass
# rate 100, all 12 grass slots and the day/night lists S_WILD at L_WILD) and a new script file whose
# script 1 is empty (the template's level script runs script 1 on entering) and script 2 the gift.
# Also Route 201's own encounter file gets S_WILD in grass slot 0, checked in the built ROM only
# (the game reaches Route 201's grass only through the story).
#
# Trainers: class 9 Wanderer, "Jens" and "Mia". The first create gives 928, the second skips the
# "seen" slot 929 (a placeholder) and gives 930 with the battle script extended. Their objects get
# script 3000 + id - 1, trainer type 1, sight 3:
#   Jens (928) at (50, 23) looking north: the player walking east on row 21 is seen at (50, 21).
#   Mia (930) at (54, 21) looking south: the player comes from the west and talks to her (press A),
#   so her battle runs through her own entry of the extended battle script (a sightline battle
#   would use the "seen" entry and not prove the extension).
# The player has no Pokémon in the save: the gift (S_GIFT at level 100, once, by a flag) at (45, 20)
# is talked to first. Objects of the map the save was made on come from the save, so the gift
# stands on the new place, not in the bedroom.
#
# Placeholders (all required, passed with --set NAME=VALUE):
#   NEUER_HEADER  id the new header gets = the header count before (593 on an unmodified Platin DE)
#   S_WILD L_WILD wild species and level (150 Mewtu, 5)
#   S_T1 L_T1     Jens' Pokémon (25 Pikachu, 12)        S_T2 L_T2  Mia's Pokémon (133 Evoli, 14)
#   S_GIFT        the gift, level 100 (445 Knakrack: no Intimidate or Keen Eye, which would change
#                 stats and hide the battle signature)
# Names an edit binds (third element) come from the bridge's answers: area (create_area), hdr,
# enc, geber_datei, route201, trainer1, trainer2; `${trainer1.id+2999}` adds to a number.
# Example (from scripts/g4emu; the copy lives under Roms/_testkopien; in a worktree set G4_ROMS_DIR,
# G4_BRIDGE_BIN and G4K_BIN, see docs/agent-gate.md):
#   uv run g4emu scenario ../agent/scenarios/pt-trainer-begegnung.yaml \
#     --project ../../../Roms/_testkopien/pt-3b3b --out ../../target/agent/gate-$(date +%F)/pt-trainer-begegnung \
#     --set NEUER_HEADER=593 --set S_WILD=150 --set L_WILD=5 --set S_T1=25 --set L_T1=12 \
#     --set S_T2=133 --set L_T2=14 --set S_GIFT=445
game: CPUD
edits:
  # (1) patch, scripts, the new place
  - [apply_header_patch, {}]
  - [adopt_scripts, {}]
  - - create_area
    - spec:
        name: Trainer und Begegnung
        width: 2
        height: 1
        cells:                       # Route 201 (header 342): matrix 0 cells (3, 26) = map 5 and (4, 26) = map 6
          - {x: 0, y: 0, source_map: 5, clear_buildings: false}
          - {x: 1, y: 0, source_map: 6, clear_buildings: false}
        with_headers: true
        header:
          id: "${NEUER_HEADER}"
          area_data_id: null
          event_file: New
          new_header: {template: 342, internal_name: T_TRAINER}
    - area
  # (2) a new, empty encounter file and a new script file on the new header
  - [get_header, {id: "${area.header}"}, hdr]
  - [create_encounter_file, {}, enc]
  - [new_script_file, {kind: script}, geber_datei]
  - - set_header
    - id: "${area.header}"
      header: {Pt: {$base: "${hdr.Pt}", wild_pokemon: "${enc}", script_file_id: "${geber_datei}"}}
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, field: rate, value: 100}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 0, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 0, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 1, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 1, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 2, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 2, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 3, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 3, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 4, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 4, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 5, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 5, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 6, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 6, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 7, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 7, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 8, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 8, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 9, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 9, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 10, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 10, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 11, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 11, field: level, value: "${L_WILD}"}}}]
  # the day and night lists replace slots 2 and 3 by the clock (the emulator's clock is not set)
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: day, slot: 0, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: day, slot: 1, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: night, slot: 0, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: night, slot: 1, field: species, value: "${S_WILD}"}}}]
  # Route 201's own file (header 342 in list_headers): grass slot 0, checked in the built ROM
  - [get_header, {id: 342}, route201]
  - [data_edit, {kind: encounter, index: "${route201.Pt.wild_pokemon}", patch: {Encounter: {method: grass, slot: 0, field: species, value: "${S_WILD}"}}}]
  # (3) two trainers, one Pokémon each, battle texts (before the battle ends on \r: the box waits)
  - [create_trainer, {class: 9, name: Jens}, trainer1]
  - [create_trainer, {class: 9, name: Mia}, trainer2]
  - - data_edit
    - kind: trainer
      index: "${trainer1.id}"
      patch: {TrainerParty: {party: [{iv_or_difficulty: 0, byte1: 0, level: "${L_T1}", species: "${S_T1}", form: 0, item: null, moves: null, ball_capsule: 0}]}}
  - - data_edit
    - kind: trainer
      index: "${trainer2.id}"
      patch: {TrainerParty: {party: [{iv_or_difficulty: 0, byte1: 0, level: "${L_T2}", species: "${S_T2}", form: 0, item: null, moves: null, ball_capsule: 0}]}}
  - - set_trainer_texts
    - trainer: "${trainer1.id}"
      texts: [{kind: 0, text: 'Halt! Ich bin Jens!\r'}, {kind: 1, text: 'Du bist stark!'}, {kind: 2, text: 'Gut gekämpft.'}]
  - - set_trainer_texts
    - trainer: "${trainer2.id}"
      texts: [{kind: 0, text: 'Ich bin Mia, kämpf mit mir!\r'}, {kind: 1, text: 'Oh nein!'}, {kind: 2, text: 'Weiter so.'}]
  # (4) the trainers on the new place, across the way east of the arrival (graphics 20: hiker)
  - - add_event
    - eventFile: "${area.event_file}"
      kind: object
      x: 50
      z: 23
      patch: {graphics_id: 20, movement_type: 14, dir: 0, script: "${trainer1.id+2999}", trainer_type: 1, sight: 3}
  - - add_event
    - eventFile: "${area.event_file}"
      kind: object
      x: 54
      z: 21
      patch: {graphics_id: 20, movement_type: 15, dir: 1, script: "${trainer2.id+2999}", trainer_type: 1, sight: 3}
  # (5) the gift north of where the player stands after arriving (script 2 of the new script file)
  - - add_event
    - eventFile: "${area.event_file}"
      kind: object
      x: 45
      z: 20
      patch: {graphics_id: 6, movement_type: 15, dir: 1, script: 2, trainer_type: 0, sight: 0}
  # (6) arrival warp 0 (back to the bedroom stairs) on a door tile (behaviour 0x69, collision 0x80,
  # as the door tool makes it; x 44 is tile 12 of the second map), the stairs to the new place
  - [add_event, {eventFile: "${area.event_file}", kind: warp, x: 44, z: 21, patch: {dest_header_id: 415, dest_warp_id: 0}}]
  - [set_permission, {index: "${area.maps.1.2}", x: 12, y: 21, kind: 105, collision: 128}]
  - [update_event, {eventFile: 394, kind: warp, index: 0, patch: {dest_header_id: "${area.header}", dest_warp_id: 0}}]
  # a text literal needs a saved header that uses the script file (it goes to the header's archive)
  - [save, {}]
  - - save_script
    - file: "${geber_datei}"
      text: |
        script Main #1:
            End

        script Geber #2:
            LockAll
            FacePlayer
            GoToIfSet FLAG_UNUSED_0x0094, label_given
            Message "Hier, nimm das."
            WaitButton
            CloseMessage
            GivePokemon ${S_GIFT}, 100, 0, VAR_RESULT
            SetFlag FLAG_UNUSED_0x0094
            ReleaseAll
            End

        label_given:
            ReleaseAll
            End
build: out.nds
check:
  - [g4k, check-data, out.nds,
     --expect, "encounter:${route201.Pt.wild_pokemon}:grass0=${S_WILD}",
     --expect, "encounter:${enc}:grass_rate=100",
     --expect, "encounter:${enc}:grass0=${S_WILD}",
     --expect, "encounter:${enc}:grass11_level=${L_WILD}"]
play:
  - continue
  - expect-map 415
  - walk-to 8 4
  - walk right 1
  - expect-map ${area.header}
  - wait 150
  - where
  - shot ankunft
  # the gift: face north, talk, through the text
  - press up:8
  - press a
  - mash a 300
  - shot geschenk
  # Jens sees the player at (50, 21), walks up and talks; A through his text into the battle
  - walk-to 49 21
  - walk right 1
  - mash a 240
  - expect-battle ${S_T1} ${L_T1} 900
  - wait 300                                # the shot shows "Eine Herausforderung von Wanderer Jens!"
  - shot trainer1
  - win-battle
  - wait 120
  - press b
  - expect-map ${area.header}
  # Mia: from the west, face her and talk
  - walk-to 53 21
  - press right:8
  - press a
  - mash a 150
  - expect-battle ${S_T2} ${L_T2} 900
  - wait 300                                # "Eine Herausforderung von Wanderer Mia!"
  - shot trainer2
  - win-battle
  - wait 120
  - press b
  - expect-map ${area.header}
  # the grass north of the way: rate 100, every slot S_WILD
  - walk-to 48 20
  - walk-until-battle up 40 back-and-forth
  - expect-battle ${S_WILD} ${L_WILD}
  - wait 400                                # "Ein wildes MEWTU erscheint!"
  - shot wild
