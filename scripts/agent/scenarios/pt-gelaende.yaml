# Platin DE, gate 6.2 (Gutachten B §5 points 2 and 3): a NEW map with a terrain generated by the studio
# (`set_map_terrain`: BDHC from a height grid, collision derived from grid and terrain kinds), walked
# in the game. The figure's height is read from RAM (`expect-height`) on the ground, on the upper
# stair tile (12 E) and on the plateau (16 E); an edge without stair (16 -> 40 E) stops it at
# (22, 21), the step of 2 without stair (found by map.step-unblocked and fixed with block_upper)
# at (18, 24), the wall at (24, 26); the tall grass gives a wild battle.
# The new map is a 1x1 area on a NEW header from Route 201 map 5 (matrix 0 cell (3, 26), template header 342)
# with a new event file (`create_area`, internal name T_GELAENDE); the bedroom stairs (header
# 415, event file 394, warp 0) lead there, the arrival is warp 0 on the door (12, 21) back to the stairs;
# the player arrives on the door and steps east by itself to (13, 21) (`where` after `wait 150`),
# and `walk down 1`, `walk-to 14 22` lead past the door. Its header gets a new encounter file
# (grass rate 100, all 12 grass slots and the day/night lists S_WILD at L_WILD;
# the emulator's clock is not set) and a new script file whose script 1 is empty (the template's
# level script runs script 1 on entering) and script 2 the gift (S_GIFT at level 100, once, by a
# flag; the save has no Pokémon), talked to from (14, 22). As in pt-trainer-begegnung.yaml.
#
# Order of the terrain edits: (a) set_map_terrain with the grid and the hand value; (b) run_checks
# finds exactly the free step; apply_fix block_upper; (c) get_map shows (18, 25) blocked
# (permissions index 25 * 32 + 18 = 818: [kind 0, collision 0x80]); (d) set_map_terrain again with
# `bdhc: ${BDHC}` and `permissions: keep` (the fixed permissions stay; no hand value). With
# BDHC=grid (d) writes the same BDHC again; with BDHC=flat it writes a flat plate at 0 (the counter
# test, B §5 gate 3): the checks and the fix ran on the grid BDHC before, the collision is the same,
# only the heights are gone, so the run must end with exit 2 and "Höhe 0 statt 16" at the step
# after `expect-at 18 21`.
#
# The new map (both games alike; tile coordinates of the 1x1 matrix; ground everywhere height 0, no
# ramp, `.`):
#   | Area                          | x     | y     | height (steps) | ramp | terrain |
#   |-------------------------------|-------|-------|----------------|------|---------|
#   | door (arrival, warp 0)        | 12    | 21    | 0              | .    | D       |
#   | stair                         | 16    | 20-22 | 0              | e1   | .       |
#   | stair                         | 17    | 20-22 | 1              | e1   | .       |
#   | plateau 16 E                  | 18-22 | 20-22 | 2              | .    | .       |
#   | edge 16 -> 40 without stair   | 23-31 | 20-22 | 5              | .    | .       |
#   | step of 2 without stair       | 16-22 | 25-27 | 2              | .    | .       |
#   | wall                          | 25    | 23-29 | 0              | .    | #       |
#   | tall grass                    | 16-28 | 3-10  | 0              | .    | g       |
#   | gift (figure, script 2)       | 14    | 23    | 0              | .    | .       |
# Hand value (18, 25) kind 0, collision 0: the upper cell of the step stays free, so that
# map.step-unblocked reports it (key step:18,25:18,24), and the fix block_upper blocks it again.
# Derived collision (docs/formats/terrain.md): an edge of 16 E or more blocks the higher cell, so of
# the plateau only row 21 is open (rows 20 and 22 lie 16 E over rows 19 and 23), (23, 21) is
# blocked (24 E over the plateau, the game would refuse the step anyway) and the step's border
# cells are blocked; the stair has no edge to the plateau (both sides 16 E) and its side edges are
# 4 and 12 E (open). The BDHC from the grid has a payload of 318 B (9 plates, 5 strips), far below
# 36 864 B; the generator never needs more than 35 592 B.
#
# Deviation from the plan's play steps (Task 9 brief): the stair is walked up to the plateau first
# (`walk right 4`, `expect-at 18 21`, `expect-height 16`), then one tile back onto the upper stair
# tile (`walk left 1`, `expect-at 17 21`, `expect-height 12 0.1`) and up again (`walk right 1`).
# In the plan's order the flat counter test failed already at the stair with "Höhe 0 statt 12"; in
# this order it fails, as the gate wants, with "Höhe 0 statt 16" at the step after `expect-at 18 21`.
# Every assertion of the plan is kept. The way itself is the plan's: the arrival steps off the door
# as expected (Platin east to (13, 21), HeartGold west to (11, 21)), nothing blocked on the way.
# Measured 06.11.2026 (6-2-szen-pt, BDHC=grid, exit 0): expect-height 0 (6 hits) at (14, 21), 16
# (6) at (18, 21), 12 (4) at (17, 21); walk-until-blocked stops at (22, 21), (18, 24) and
# (24, 26); a wild Mewtu Lv 5 on the first grass tile (16, 10). BDHC=flat (6-2-flach-pt): exit 2,
# "Höhe 0 statt 16 (±0.1) bei Kachel x 18, y 21; Treffer 0 (6×)". The terrain changes only BDHC
# and collision, the model stays Route 201's: at "stufe" only the head shows over its trees and at
# "wand" the figure is hidden by them (expect-at proves the place).
#
# Placeholders (all required, passed with --set NAME=VALUE):
#   NEUER_HEADER  id the new header gets = the header count before (593 on an unmodified Platin DE)
#   S_WILD L_WILD wild species and level (150 Mewtu, 5)
#   S_GIFT        the gift, level 100 (445 Knakrack)
#   BDHC          grid (the gate) or flat (the counter test: exit 2, "Höhe 0 statt 16")
# Names an edit binds (third element) come from the bridge's answers: area (create_area), hdr, enc,
# geber_datei, r_step.
# Example (from scripts/g4emu; the copy lives under Roms/_testkopien; from a worktree set
# G4_ROMS_DIR (absolute), G4_BRIDGE_BIN and G4K_BIN to target/debug/studio-bridge and
# target/debug/g4k after `cargo build --workspace --all-features`, see docs/agent-gate.md):
#   uv run g4emu scenario ../agent/scenarios/pt-gelaende.yaml \
#     --project $G4_ROMS_DIR/_testkopien/<copy>_DSPRE_contents \
#     --out ../../target/agent/gate-$(date +%F)/pt-gelaende \
#     --set NEUER_HEADER=593 --set S_WILD=150 --set L_WILD=5 --set S_GIFT=445 --set BDHC=grid
# A copy that ran past the build is saved and built: every run needs a fresh copy.
