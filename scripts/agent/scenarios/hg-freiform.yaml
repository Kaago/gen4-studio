# HeartGold DE, gate 6.5b (agent part, "glTF-Freiform in einer Welt-Karte backt und ist in g4emu zu
# sehen"): the painted map of hg-gemalt.yaml (6.3b) with a free-form model. The edits are those of
# hg-gemalt.yaml with three additions: `prepare` writes the synthetic samples (`g4k import-samples
# import`: g4_imp_cube.obj with its orange-blue checker texture, ...) into import/ of the copy; after
# the last `world_edit` `world_freeform_add` stands the cube on the map (a side file
# data/maps/<map>.g4_imp_cube.glb and an entry in the world's `freeform`, one undo step), and the
# bake that follows counts its 6 faces (`freeform_faces`). In the game only the arrival is played:
# `expect-at` on the starting point and `shot freiform` looks north at the cube.
#
# Where the cube stands (`at`, world units from the map's centre, x east, y up, z south; cell
# (x, z) has its centre at (16x + 8 - 256, 16z + 8 - 256)): the sample cube is x and z in -0.5..0.5,
# y in 0..1 (model_import::samples::cube_obj); `unit: 32` makes it 32 world units = two tiles a
# side. The starting point is (11, 21) (the player arrives on the door (12, 21) and steps west
# by itself, see hg-gemalt.yaml); two tiles north is cell (11, 19): at = (16*11 + 8 - 256, 0,
# 16*19 + 8 - 256) = (-72, 0, 56). Its centre on that cell's centre, the cube covers cell (11, 19)
# and half of each neighbour (x 10-12, z 18-20); y 0 is the ground's height (height 0
# everywhere there). The model only adds faces to the map's model (world/bake.rs); BDHC and
# collision still come from the painted cells, so the cells under the cube stay walkable.
#
# The project becomes a text project first (`assign_base` with the .nds beside the copy,
# `adopt_text_project`, which adopts the scripts too). The new map is a 1x1 area on a NEW header from
# Route 29 map 1 (matrix 0 cell (18, 12), template header 33, area data 2, map texture pack 2) with a
# new event file (`create_area`, internal name T_GEMALT, the copied buildings cleared); the bedroom
# stairs (header 64, event file 61, warp 0) lead there, the arrival is warp 0 on the door (12, 21)
# back to the stairs; the player arrives on the door and steps west by itself to (11, 21). Its header
# gets a new encounter file (grass rate 100, all 12 grass slots S_WILD at L_WILD in all three time
# columns) and a new script file whose script 1 is empty and script 2 the gift (S_GIFT at level 100,
# once, by a flag; the save has no Pokémon), talked to from (14, 22). As in hg-gelaende.yaml; the
# gift figure uses `graphics_id: 317` (HeartGold).
#
# The painted world is fixtures::gate_world (crates/g4-kernel/src/world/doc.rs), cells (x, z):
#   | Area                  | x     | z     | tile   | height (steps) | ramp | permission     |
#   |-----------------------|-------|-------|--------|----------------|------|----------------|
#   | ground                | rest  | rest  | GROUND | 0              | .    | derived        |
#   | tall grass            | 16-28 | 3-10  | GRASS  | 0              | .    | derived [2, 0] |
#   | water                 | 2-8   | 24-29 | WATER  | 0              | .    | derived [21,0] |
#   | stair, lower tile     | 16    | 20-22 | GROUND | 0              | e1   | derived        |
#   | stair, upper tile     | 17    | 20-22 | GROUND | 1              | e1   | derived        |
#   | plateau 16 E          | 18-22 | 20-22 | GROUND | 2              | .    | derived        |
#   | door (arrival, warp 0)| 12    | 21    | GROUND | 0              | .    | hand 6980      |
#   | gift (figure)         | 14    | 23    | GROUND | 0              | .    | derived        |
# Tiles of the derived tileset of pack 2 (indices only, chosen by looking at get_tileset_texture):
# GROUND 22 = 0016 (light green, plain), GRASS 36 = 0024 (dark green tall grass), WATER 57 = 0039
# (light blue, sparkling), WALL 12 (brown cliff face). The derived tiles carry no step sound, so the
# permissions below are the same as in Platin. `tileset_save` writes the tileset file,
# `tileset_edit` makes GRASS role grass, kind 2, collision 0; WATER role water, kind 21 (0x15),
# collision 0; WALL role wall; GROUND gets `wall: 12` (the walls below a ground cell take WALL's texture).
# Derived collision: an edge of 16 E or more blocks the higher cell, so of the plateau only the
# inner cells of row 21 are open: rows 20 and 22 lie 16 E over rows 19 and 23, (22, 21) 16 E over
# (23, 21); the stair's edges are 8 E at most (open). get_map shows it at permissions index
# z * 32 + x: grass (16, 3) 112 = [2, 0], water (2, 24) 770 = [21, 0], plateau border (22, 21)
# 694 = [0, 128], door (12, 21) 684 = [105, 128].
#
# Play: `clock 12:00` (daylight as in `shot tag` of the source), to the new map, `expect-at` on
# the starting point (11, 21), `shot freiform`: the cube with its checker texture above the
# painted ground (the light green GROUND tile, as in the shots of the source).
#
# Placeholders (all required, passed with --set NAME=VALUE):
#   BASIS         the .nds beside the copy, relative to the project folder (../<copy>.nds)
#   NEUER_HEADER  id the new header gets = the header count before (540 on an unmodified HeartGold DE)
#   S_WILD L_WILD wild species and level (150 Mewtu, 5)
#   S_GIFT        the gift, level 100 (445 Knakrack)
#   KOPIE         the copy's folder as an absolute path: the bridge reads the model file from a path
#                 relative to its own working folder (scripts/g4emu), not to the project, so the
#                 scenario names it absolutely (as hg-kleiner-hack-ohne-import.yaml does)
# Names an edit binds (third element) come from the bridge's answers: area (create_area), hdr, enc,
# geber_datei, w (world_create: map, tileset, cells, change, bake).
# Example (from scripts/g4emu; the copy lives under Roms/_testkopien; from a worktree set
# G4_ROMS_DIR (absolute), G4_BRIDGE_BIN and G4K_BIN to target/debug/studio-bridge and
# target/debug/g4k after `cargo build --workspace --all-features`, see docs/agent-gate.md):
#   uv run g4emu scenario ../agent/scenarios/hg-freiform.yaml \
#     --project $G4_ROMS_DIR/_testkopien/6-5b-szen-hg_DSPRE_contents \
#     --out $W/target/agent/gate-$(date +%F)/6-5b/hg-freiform \
#     --set BASIS=../6-5b-szen-hg.nds --set NEUER_HEADER=540 --set S_WILD=150 --set L_WILD=5 --set S_GIFT=445 \
#     --set KOPIE=$G4_ROMS_DIR/_testkopien/6-5b-szen-hg_DSPRE_contents
# A copy that ran past the build is saved and built: every run needs a fresh copy.
game: IPKD
prepare:
  - [make-import-samples, {path: import}]
edits:
  # (1) base ROM, patch, text project (adopts the scripts), the new place
  - [assign_base, {nds: "${BASIS}"}]
  - [apply_header_patch, {}]
  - [adopt_text_project, {}]
  - - create_area
    - spec:
        name: Gemalt
        width: 1
        height: 1
        cells:                       # Route 29 (header 33): matrix 0 cell (18, 12) = map 1
          - {x: 0, y: 0, source_map: 1, clear_buildings: true}
        with_headers: true
        header:
          id: "${NEUER_HEADER}"
          area_data_id: null
          event_file: New
          new_header: {template: 33, internal_name: T_GEMALT}
    - area
  # (2) a new, empty encounter file and a new script file on the new header
  - [get_header, {id: "${area.header}"}, hdr]
  - [create_encounter_file, {}, enc]
  - [new_script_file, {kind: script}, geber_datei]
  - - set_header
    - id: "${area.header}"
      header: {HGSS: {$base: "${hdr.HGSS}", wild_pokemon: "${enc}", script_file_id: "${geber_datei}"}}
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, field: rate, value: 100}}}]
  # every grass slot: the day column (species), morning and night
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 0, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 0, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 0, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 0, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 1, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 1, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 1, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 1, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 2, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 2, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 2, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 2, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 3, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 3, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 3, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 3, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 4, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 4, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 4, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 4, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 5, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 5, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 5, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 5, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 6, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 6, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 6, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 6, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 7, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 7, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 7, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 7, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 8, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 8, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 8, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 8, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 9, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 9, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 9, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 9, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 10, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 10, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 10, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 10, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 11, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 11, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 11, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 11, field: species_night, value: "${S_WILD}"}}}]
  # (3) the world: ground GROUND (0016) at height 0 everywhere, the package from the map's header
  - [world_create, {req: {map: "${area.maps.0.2}", fill: "0016"}}, w]
  # the tileset file of the package, then the roles: GRASS 36, WATER 57, WALL 12 below GROUND 22
  - [tileset_save, {package: "${w.tileset}"}]
  - - tileset_edit
    - req:
        package: "${w.tileset}"
        changes:
          - {tile: 36, role: grass, kind: 2, collision: 0}
          - {tile: 57, role: water, kind: 21, collision: 0}
          - {tile: 12, role: wall}
          - {tile: 22, wall: 12}
    - expect: {path: tiles, equals: 4}
  # the cells of gate_world, one stroke (one undo step)
  - - world_edit
    - req:
        map: "${area.maps.0.2}"
        changes:
          - tile: "0024"           # tall grass x 16-28, z 3-10
            cells: [
              [16, 3], [17, 3], [18, 3], [19, 3], [20, 3], [21, 3], [22, 3], [23, 3], [24, 3], [25, 3], [26, 3], [27, 3], [28, 3],
              [16, 4], [17, 4], [18, 4], [19, 4], [20, 4], [21, 4], [22, 4], [23, 4], [24, 4], [25, 4], [26, 4], [27, 4], [28, 4],
              [16, 5], [17, 5], [18, 5], [19, 5], [20, 5], [21, 5], [22, 5], [23, 5], [24, 5], [25, 5], [26, 5], [27, 5], [28, 5],
              [16, 6], [17, 6], [18, 6], [19, 6], [20, 6], [21, 6], [22, 6], [23, 6], [24, 6], [25, 6], [26, 6], [27, 6], [28, 6],
              [16, 7], [17, 7], [18, 7], [19, 7], [20, 7], [21, 7], [22, 7], [23, 7], [24, 7], [25, 7], [26, 7], [27, 7], [28, 7],
              [16, 8], [17, 8], [18, 8], [19, 8], [20, 8], [21, 8], [22, 8], [23, 8], [24, 8], [25, 8], [26, 8], [27, 8], [28, 8],
              [16, 9], [17, 9], [18, 9], [19, 9], [20, 9], [21, 9], [22, 9], [23, 9], [24, 9], [25, 9], [26, 9], [27, 9], [28, 9],
              [16, 10], [17, 10], [18, 10], [19, 10], [20, 10], [21, 10], [22, 10], [23, 10], [24, 10], [25, 10], [26, 10], [27, 10], [28, 10]
            ]
          - tile: "0039"           # water x 2-8, z 24-29
            cells: [
              [2, 24], [3, 24], [4, 24], [5, 24], [6, 24], [7, 24], [8, 24],
              [2, 25], [3, 25], [4, 25], [5, 25], [6, 25], [7, 25], [8, 25],
              [2, 26], [3, 26], [4, 26], [5, 26], [6, 26], [7, 26], [8, 26],
              [2, 27], [3, 27], [4, 27], [5, 27], [6, 27], [7, 27], [8, 27],
              [2, 28], [3, 28], [4, 28], [5, 28], [6, 28], [7, 28], [8, 28],
              [2, 29], [3, 29], [4, 29], [5, 29], [6, 29], [7, 29], [8, 29]
            ]
          - {ramp: e1, cells: [[16, 20], [16, 21], [16, 22]]}   # stair, lower tile
          - {ramp: e1, cells: &treppe_oben [[17, 20], [17, 21], [17, 22]]}    # stair, upper tile
          - {height: 1, cells: *treppe_oben}
          - height: 2              # plateau x 18-22, z 20-22 (16 E)
            cells: [
              [18, 20], [19, 20], [20, 20], [21, 20], [22, 20],
              [18, 21], [19, 21], [20, 21], [21, 21], [22, 21],
              [18, 22], [19, 22], [20, 22], [21, 22], [22, 22]
            ]
          - {permission: "6980", cells: [[12, 21]]}                        # door: behaviour 0x69, blocked
    - expect: {path: cells, equals: 171}
  # the free-form cube, two tiles a side, two tiles north of the starting point (11, 21)
  - - world_freeform_add
    - req: {map: "${area.maps.0.2}", path: "${KOPIE}/import/g4_imp_cube.obj", at: [-72, 0, 56], options: {unit: 32}}
    - expect: {path: bake.freeform_faces, equals: 6}
      as: cube
  # the bake as the store holds it: accepted, outdoor light (area data 2, light type 1), the cube's 6 faces
  - - world_bake
    - {map: "${area.maps.0.2}"}
    - expect:
        - {path: ok, equals: true}
        - {path: style, equals: outdoor}
        - {path: freeform_faces, equals: 6}
  # derived permissions: grass, water, the plateau's east border, the door's hand value
  - - get_map
    - index: "${area.maps.0.2}"
    - expect:
        - {path: permissions.112, equals: [2, 0]}
        - {path: permissions.770, equals: [21, 0]}
        - {path: permissions.694, equals: [0, 128]}
        - {path: permissions.684, equals: [105, 128]}
  # (4) the gift south of (14, 22) (script 2 of the new script file)
  - - add_event
    - eventFile: "${area.event_file}"
      kind: object
      x: 14
      z: 23
      patch: {graphics_id: 317, movement_type: 15, dir: 0, script: 2, trainer_type: 0, sight: 0}
  # (5) arrival warp 0 (back to the bedroom stairs) on the door, the stairs to the new place
  - [add_event, {eventFile: "${area.event_file}", kind: warp, x: 12, z: 21, patch: {dest_header_id: 64, dest_warp_id: 0}}]
  - [update_event, {eventFile: 61, kind: warp, index: 0, patch: {dest_header_id: "${area.header}", dest_warp_id: 0}}]
  # a text literal needs a saved header that uses the script file (it goes to the header's archive)
  - [save, {}]
  - - save_script
    - file: "${geber_datei}"
      text: |
        script Main #1:
            End

        script Geber #2:
            LockAll
            FacePlayer
            GoToIfSet FLAG_UNK_0A1, label_given
            NPCMsg "Hier, nimm das."
            WaitButton
            CloseMsg
            GiveMon ${S_GIFT}, 100, 0, 0, 0, VAR_SPECIAL_RESULT
            SetFlag FLAG_UNK_0A1
            ReleaseAll
            End

        label_given:
            ReleaseAll
            End
build: out.nds
play:
  # day: the clock at noon, the console restarts with it
  - clock 12:00
  - continue
  - expect-map 64
  - walk left 1
  - walk down 1
  - expect-map ${area.header}
  - wait 150
  - where
  # the starting point; the cube stands two tiles north (cell (11, 19))
  - expect-at 11 21
  - shot freiform
