# HeartGold DE, gate 3h.2: headless over MCP (`studio mcp`, one session) a route with two trainers
# and text, built and walked; the encounter edits are one g4_batch and so ONE undo step. The layout
# is the one of hg-trainer-begegnung.yaml (no import), the edits are tool calls of the curated MCP
# tool set (snake_case arguments); what no curated tool does (adopt_scripts, create_encounter_file,
# new_script_file, set_permission) goes through g4_call with the command's own arguments. The runner
# calls save and build_rom {out: build/out.nds} at the end.
#
# The new place is a NEW header on a copy of the Route 29 map 1 (template 33) with a new event file;
# the bedroom stairs (event file 61, warp 0) lead there, the arrival is a door at (24, 16) on the way
# south of the grass (the player steps west off it to 23, 16). Its header gets a new encounter file
# (grass rate 100, all 12 grass slots S_WILD at L_WILD in all three time columns: morning, day,
# night) and a new script file whose script 1 is empty (the template's level script 470 runs script
# 1 on entering) and script 2 the gift ("Hier, nimm das."). Route 29's own encounter file gets S_WILD
# in grass slot 0 (all three columns), checked in the built ROM only. The player never leaves the
# house through its door: the Lyra event in front of the house does not run.
#
# The batch: the 52 data_edit calls (49 on the new file, 3 on Route 29's) run as one g4_batch with
# the label "Agent: Begegnungen". history before it (bound as h0) and after it proves one undo step
# more, labelled so; undo takes the batch back (data_get: the grass rate and slot 0 as before it,
# bound as enc_vorher), redo brings it again (rate 100, slot 0 S_WILD).
#
# Trainers: class 9 Wanderer. The first create gives 738 ("Jens"), the second 739 ("Lea", data
# only, not placed), the third skips the "seen" slot 740 (a placeholder) and gives 741 ("Mia") with
# the battle script extended. Their objects get script 3000 + id - 1, trainer type 1, sight 3:
#   Jens (738) at (20, 18) looking north through the gap in the fence: the player walking west on
#   row 16 is seen at (20, 16).
#   Mia (741) at (14, 16) looking north: the player comes from the east and talks to her (press A).
# The player has no Pokémon in the save: the gift (S_GIFT at level 100, once, by a flag) at
# (23, 15), north of the arrival, is talked to first.
#
# Placeholders (all required, passed with --set NAME=VALUE):
#   NEUER_HEADER  id the new header gets = the header count before (540 on an unmodified HeartGold DE)
#   S_WILD L_WILD wild species and level (150 Mewtu, 5)
#   S_T1 L_T1     Jens' Pokémon (25 Pikachu, 12)        S_T2 L_T2  Mia's Pokémon (133 Evoli, 14)
#   S_GIFT        the gift, level 100 (445 Knakrack: no Intimidate or Keen Eye, which would change
#                 stats and hide the battle signature)
# Names an edit binds (third element, or `as`) come from the tools' answers (structuredContent.result):
# area (create_area), hdr, enc, geber_datei, route29, enc_vorher, h0, trainer1, trainer_lea, trainer2.
# Example (from scripts/g4emu; in a worktree set G4_ROMS_DIR, G4_STUDIO_BIN and G4K_BIN, see
# docs/agent-gate.md):
#   uv run g4emu scenario ../agent/scenarios/hg-mcp-route.yaml \
#     --project $G4_ROMS_DIR/_testkopien/3h-hg-route --out ../../target/agent/gate-$(date +%F)/hg-mcp-route \
#     --set NEUER_HEADER=540 --set S_WILD=150 --set L_WILD=5 --set S_T1=25 --set L_T1=12 \
#     --set S_T2=133 --set L_T2=14 --set S_GIFT=445
game: IPKD
mcp: [--allow-irreversible, --expert]
edits:
  # (1) patch, scripts, the new place
  - [apply_header_patch, {}]
  - [g4_call, {command: adopt_scripts}]
  - - create_area
    - spec:
        name: Trainer und Begegnung
        width: 1
        height: 1
        cells:                       # Route 29 (header 33): matrix 0 cell (18, 12) = map 1
          - {x: 0, y: 0, source_map: 1, clear_buildings: false}
        with_headers: true
        header:
          id: "${NEUER_HEADER}"
          area_data_id: null
          event_file: New
          new_header: {template: 33, internal_name: T_TRAINER}
    - area
  # (2) a new, empty encounter file and a new script file on the new header
  - [get_header, {id: "${area.header}"}, hdr]
  - [g4_call, {command: create_encounter_file}, enc]
  - [g4_call, {command: new_script_file, args: {kind: script}}, geber_datei]
  - - set_header
    - id: "${area.header}"
      header: {HGSS: {$base: "${hdr.HGSS}", wild_pokemon: "${enc}", script_file_id: "${geber_datei}"}}
  # (3) the encounters as ONE undo step: the file before, the history before, the batch, the history after
  - [get_header, {id: 33}, route29]
  - [data_get, {kind: encounter, index: "${enc}"}, enc_vorher]
  - [history, {}, h0]
  - - g4_batch
    - label: "Agent: Begegnungen"
      calls:
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, field: rate, value: 100}}}}
        # every grass slot: the day column (species), morning and night (the emulator's clock is not set)
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 0, field: species, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 0, field: species_morning, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 0, field: species_night, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 0, field: level, value: "${L_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 1, field: species, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 1, field: species_morning, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 1, field: species_night, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 1, field: level, value: "${L_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 2, field: species, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 2, field: species_morning, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 2, field: species_night, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 2, field: level, value: "${L_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 3, field: species, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 3, field: species_morning, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 3, field: species_night, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 3, field: level, value: "${L_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 4, field: species, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 4, field: species_morning, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 4, field: species_night, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 4, field: level, value: "${L_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 5, field: species, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 5, field: species_morning, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 5, field: species_night, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 5, field: level, value: "${L_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 6, field: species, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 6, field: species_morning, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 6, field: species_night, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 6, field: level, value: "${L_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 7, field: species, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 7, field: species_morning, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 7, field: species_night, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 7, field: level, value: "${L_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 8, field: species, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 8, field: species_morning, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 8, field: species_night, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 8, field: level, value: "${L_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 9, field: species, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 9, field: species_morning, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 9, field: species_night, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 9, field: level, value: "${L_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 10, field: species, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 10, field: species_morning, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 10, field: species_night, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 10, field: level, value: "${L_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 11, field: species, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 11, field: species_morning, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 11, field: species_night, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 11, field: level, value: "${L_WILD}"}}}}
        # Route 29's own file (header 33): grass slot 0 in all three columns, checked in the built ROM
        - {tool: data_edit, arguments: {kind: encounter, index: "${route29.HGSS.wild_pokemon}", patch: {Encounter: {method: grass, slot: 0, field: species, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${route29.HGSS.wild_pokemon}", patch: {Encounter: {method: grass, slot: 0, field: species_morning, value: "${S_WILD}"}}}}
        - {tool: data_edit, arguments: {kind: encounter, index: "${route29.HGSS.wild_pokemon}", patch: {Encounter: {method: grass, slot: 0, field: species_night, value: "${S_WILD}"}}}}
  - - history
    - {}
    - expect:
        - {path: undo.length, equals: "${h0.undo.length+1}"}
        - {path: "undo.${h0.undo.length}", equals: "Agent: Begegnungen"}
  # undo takes the whole batch back, redo brings it again
  - [undo, {}]
  - - data_get
    - {kind: encounter, index: "${enc}"}
    - expect:
        - {path: "methods[method=grass].0.rate", equals: "${enc_vorher.methods.0.rate}"}
        - {path: "methods[method=grass].0.slots.0.species", equals: "${enc_vorher.methods.0.slots.0.species}"}
  - [redo, {}]
  - - data_get
    - {kind: encounter, index: "${enc}"}
    - expect:
        - {path: "methods[method=grass].0.rate", equals: 100}
        - {path: "methods[method=grass].0.slots.0.species", equals: "${S_WILD}"}
  # (4) three trainers: 738 and 739 need no extension, the third skips the "seen" slot 740 and
  # extends the battle script to 741. One Pokémon each for the two placed ones, battle texts
  # (before the battle ends on \r: the box waits)
  - [create_trainer, {class: 9, name: Jens}, trainer1]
  - [create_trainer, {class: 9, name: Lea}, trainer_lea]
  - [create_trainer, {class: 9, name: Mia}, trainer2]
  - - data_edit
    - kind: trainer
      index: "${trainer1.id}"
      patch: {TrainerParty: {party: [{iv_or_difficulty: 0, byte1: 0, level: "${L_T1}", species: "${S_T1}", form: 0, item: null, moves: null, ball_capsule: 0, gender: 0, ability: 0}]}}
  - - data_edit
    - kind: trainer
      index: "${trainer2.id}"
      patch: {TrainerParty: {party: [{iv_or_difficulty: 0, byte1: 0, level: "${L_T2}", species: "${S_T2}", form: 0, item: null, moves: null, ball_capsule: 0, gender: 0, ability: 0}]}}
  - - set_trainer_texts
    - trainer: "${trainer1.id}"
      texts: [{kind: 0, text: 'Halt! Ich bin Jens!\r'}, {kind: 1, text: 'Du bist stark!'}, {kind: 2, text: 'Gut gekämpft.'}]
  - - set_trainer_texts
    - trainer: "${trainer2.id}"
      texts: [{kind: 0, text: 'Ich bin Mia, kämpf mit mir!\r'}, {kind: 1, text: 'Oh nein!'}, {kind: 2, text: 'Weiter so.'}]
  # (5) the trainers on the new place, west of the arrival (graphics 333: hiker, as Wanderer Tom on
  # Route 33; movement 14 looks north)
  - - add_event
    - event_file: "${area.event_file}"
      kind: object
      x: 20
      z: 18
      patch: {graphics_id: 333, movement_type: 14, dir: 0, script: "${trainer1.id+2999}", trainer_type: 1, sight: 3}
  - - add_event
    - event_file: "${area.event_file}"
      kind: object
      x: 14
      z: 16
      patch: {graphics_id: 333, movement_type: 14, dir: 0, script: "${trainer2.id+2999}", trainer_type: 1, sight: 3}
  # (6) the gift north of where the player stands after arriving (script 2 of the new script file)
  - - add_event
    - event_file: "${area.event_file}"
      kind: object
      x: 23
      z: 15
      patch: {graphics_id: 317, movement_type: 15, dir: 1, script: 2, trainer_type: 0, sight: 0}
  # (7) arrival warp 0 (back to the bedroom stairs) on a door tile (behaviour 0x69, collision 0x80,
  # as the door tool makes it), the stairs to the new place
  - [add_event, {event_file: "${area.event_file}", kind: warp, x: 24, z: 16, patch: {dest_header_id: 64, dest_warp_id: 0}}]
  - [g4_call, {command: set_permission, args: {index: "${area.maps.0.2}", x: 24, y: 16, kind: 105, collision: 128}}]
  - [update_event, {event_file: 61, kind: warp, index: 0, patch: {dest_header_id: "${area.header}", dest_warp_id: 0}}]
  # a text literal needs a saved header that uses the script file (it goes to the header's archive)
  - [save, {}]
  - - save_script
    - file: "${geber_datei}"
      text: |
        script Main #1:
            End

        script Geber #2:
            LockAll
            FacePlayer
            GoToIfSet FLAG_UNK_0A1, label_given
            NPCMsg "Hier, nimm das."
            WaitButton
            CloseMsg
            GiveMon ${S_GIFT}, 100, 0, 0, 0, VAR_SPECIAL_RESULT
            SetFlag FLAG_UNK_0A1
            ReleaseAll
            End

        label_given:
            ReleaseAll
            End
build: build/out.nds
check:
  - [g4k, check-data, build/out.nds,
     --expect, "encounter:${route29.HGSS.wild_pokemon}:grass0=${S_WILD}",
     --expect, "encounter:${route29.HGSS.wild_pokemon}:grass0_morning=${S_WILD}",
     --expect, "encounter:${route29.HGSS.wild_pokemon}:grass0_night=${S_WILD}",
     --expect, "encounter:${enc}:grass_rate=100",
     --expect, "encounter:${enc}:grass0=${S_WILD}",
     --expect, "encounter:${enc}:grass11_morning=${S_WILD}",
     --expect, "encounter:${enc}:grass11_night=${S_WILD}",
     --expect, "encounter:${enc}:grass11_level=${L_WILD}"]
play:
  - continue
  - expect-map 64
  - walk left 1
  - walk down 1
  - expect-map ${area.header}
  - wait 150
  - where
  - shot ankunft
  # the gift: face north, talk, through the text
  - press up:8
  - press a
  - mash a 300
  - shot geschenk
  # Jens sees the player at (20, 16), walks up through the gap and talks; A through his text
  - walk-to 21 16
  - walk left 1
  - mash a 240
  - expect-battle ${S_T1} ${L_T1} 900
  - wait 300                                # the shot shows the challenge text
  - shot trainer1
  - win-battle
  - wait 120
  - press b
  - expect-map ${area.header}
  # Mia: from the east, face her and talk
  - walk-to 15 16
  - press left:8
  - press a
  - mash a 150
  - expect-battle ${S_T2} ${L_T2} 900
  - wait 300
  - shot trainer2
  - win-battle
  - wait 120
  - press b
  - expect-map ${area.header}
  # the grass north of the way: rate 100, every slot and column S_WILD
  - walk-to 17 16
  - walk-until-battle up 40 back-and-forth
  - expect-battle ${S_WILD} ${L_WILD}
  - wait 400
  - shot wild
