# HeartGold DE, 3b overall gate ("small hack", 3b.4b Task 4, gate B): a new place on a NEW header
# whose map is a copy of Route 29 map 1 (template 33) with the model and the collision of Route 29
# map 2 imported, a new encounter file, two trainers, a gift and a script found missing and fixed,
# every step checked by the project checks (3b.4a) and the result walked, met and beaten in the game.
# Continues hg-trainer-begegnung.yaml (3b.3b); trainers, gift and encounters as there.
#
# Every `run_checks` is a full run whose answer the third element `{expect: …}` checks, always with
# `groups.length = 3` (an answer without all groups is "no result", never "clean"). A missed
# expectation ends the scenario with exit 2 and names path, Soll and Ist.
#
# The new map: create_area makes a 1x1 area from map 1 (matrix 0 cell (18, 12)); its map is
# ${area.maps.0.2} (676 on an unmodified HeartGold DE), its coordinates are those of map 1 and 2.
# Map 1 blocks row 24 east of x 11 (tile (12, 24), collision 0x80); map 2 is open from (0, 24) to
# (29, 24). So `walk-to 20 24` from (7, 24) only works with the imported collision (without the
# import it ends "blockiert bei x 11, y 24"), and the shot shows the imported model (same area pack
# 2, so it is textured). Row 24 of map 2 is plain ground; everything except the wild battle stays
# off the grass (at rate 100 most grass steps give a battle).
# Arrival: warp 0 of the new event file at (8, 25), walkable on map 1 (grass) and map 2, on a door
# tile (behaviour 0x69, collision 0x80), set AFTER the import (which replaces the whole permission
# file). The bedroom stairs (event file 61, warp 0; the bedroom is header 64 as in 3b.3b, the plan's
# "Heim 63" is the room below, where a lost battle ends) lead there; the player arrives on the door
# and steps west by itself to (7, 25) (`where` after `wait 150`, as in 3b.3b), so the way east never
# crosses the door.
# Figures (map 2's ground): the gift (script 2) at (6, 25) west of where the player stands after
# arriving; the neighbour (script 3, the one found missing) at (7, 26) south of it; Jens (sightline,
# looks north) at (24, 26), seen at (24, 24); Mia (talked to, looks north) at (27, 24). The wild
# battle in the grass at (30, 17).
#
# Checks (after accept_baseline every vanilla warning and hint is ignored, so `findings` holds only
# what this scenario causes): warp.dest-warp while the stairs point at a header without warp 0;
# trainer.no-party after create_trainer; text.too-wide for an appended long line (fixed by `wrap`);
# event.script-missing for a figure with script 3 that the new script file lacks (fixed by
# `create_script`, which is not undoable).
# The import: model and permissions of map 2 exported to <copy>/export/, the import checked
# (inspect_map_import) and done. Counter case: a synthetic model over 0xF000 bytes (made by
# `prepare:`) is refused by import_map_parts with "61440" in the message and inspect_map_import
# reports it as an error (model.too-big). That a refusal writes nothing is not shown here (the
# refused call's session ends unsaved); the kernel test import_refuses_on_error_and_changes_nothing
# covers it.
# The new header gets its own text archive (create_text_archive): its message 0 is changed and one
# message appended (index 1, the archive held one), so Route 29's dialog archive stays as it was.
# The script file: script 2 gives S_GIFT at level 100 once (by a flag), script 3 gives a Potion
# (item 17) once (by another flag) and says another text afterwards.
#
# Placeholders (all required, passed with --set NAME=VALUE):
#   NEUER_HEADER  id the new header gets = the header count before (540 on an unmodified HeartGold DE)
#   KOPIE         absolute path of the project copy (the exports go to ${KOPIE}/export/, under the
#                 bridge's import root)
#   S_WILD L_WILD wild species and level (150 Mewtu, 5)
#   S_T1 L_T1     Jens' Pokémon (25 Pikachu, 12)        S_T2 L_T2  Mia's Pokémon (133 Evoli, 14)
#   S_GIFT        the gift, level 100 (445 Knakrack: no Intimidate or Keen Eye)
# The file hashes in `check:` (`${sha1-of:export/…}`, relative to the copy) are read after the build.
# Names an edit binds (third element) come from the bridge's answers: area, hdr, enc, archiv,
# geber_datei, trainer1, trainer2, r_text, r_script; `${trainer1.id+2999}` adds to a number.
# Example (from scripts/g4emu; the copy lives under Roms/_testkopien; in a worktree set G4_ROMS_DIR,
# G4_BRIDGE_BIN and G4K_BIN, see docs/agent-gate.md):
#   uv run g4emu scenario ../agent/scenarios/hg-kleiner-hack.yaml \
#     --project ../../../Roms/_testkopien/hg-3b4b --out ../../target/agent/gate-$(date +%F)/hg-kleiner-hack \
#     --set NEUER_HEADER=540 --set KOPIE=$(cd ../../../Roms/_testkopien/hg-3b4b && pwd) \
#     --set S_WILD=150 --set L_WILD=5 --set S_T1=25 --set L_T1=12 --set S_T2=133 --set L_T2=14 \
#     --set S_GIFT=445
game: IPKD
prepare:
  - [make-oversize-nsbmd, {path: export/zu-gross.nsbmd}]
edits:
  # (1) patch and scripts (adopting adds the script checks), then the vanilla findings as the
  # baseline: nothing is left
  - [apply_header_patch, {}]
  - [adopt_scripts, {}]
  - [accept_baseline, {}]
  - - run_checks
    - {scope: full}
    - expect:
        - {path: groups.length, equals: 3}
        - {path: "findings[severity=error].length", equals: 0}
        - {path: "findings[severity=warning].length", equals: 0}
  # (2) the new place (1x1 from map 1, new header, new empty event file)
  - - create_area
    - spec:
        name: Kleiner Hack
        width: 1
        height: 1
        cells:                       # Route 29 (header 33): matrix 0 cell (18, 12) = map 1
          - {x: 0, y: 0, source_map: 1, clear_buildings: false}
        with_headers: true
        header:
          id: "${NEUER_HEADER}"
          area_data_id: null
          event_file: New
          new_header: {template: 33, internal_name: T_KLEINHACK}
    - area
  # the stairs point at the new header, which has no warp 0 yet: one error
  - [update_event, {eventFile: 61, kind: warp, index: 0, patch: {dest_header_id: "${area.header}", dest_warp_id: 0}}]
  - - run_checks
    - {scope: full}
    - expect:
        - {path: groups.length, equals: 3}
        - {path: "findings[code=warp.dest-warp].length", equals: 1}
        - {path: findings.length, equals: 1}
  # the arrival, warp 0 back to the stairs: green
  - [add_event, {eventFile: "${area.event_file}", kind: warp, x: 8, z: 25, patch: {dest_header_id: 64, dest_warp_id: 0}}]
  - - run_checks
    - {scope: full}
    - expect:
        - {path: groups.length, equals: 3}
        - {path: findings.length, equals: 0}
  # (3) export model and permissions of map 2, check and import them into the new map
  - [export_map_part, {map: 2, part: model, path: "${KOPIE}/export/karte2.nsbmd"}]
  - [export_map_part, {map: 2, part: permissions, path: "${KOPIE}/export/karte2.per"}]
  - - inspect_map_import
    - map: "${area.maps.0.2}"
      source: {files: ["${KOPIE}/export/karte2.nsbmd", "${KOPIE}/export/karte2.per"]}
    - expect:
        - {path: length, equals: 2}
        - {path: "[part=model].0.state.kind", equals: ok}
        - {path: "[part=permissions].0.state.kind", equals: ok}
  - - import_map_parts
    - map: "${area.maps.0.2}"
      source: {files: ["${KOPIE}/export/karte2.nsbmd", "${KOPIE}/export/karte2.per"]}
      parts: [model, permissions]
  # counter case: a model over 0xF000 bytes is refused (the message names the limit 61440) ...
  - - import_map_parts
    - map: "${area.maps.0.2}"
      source: {files: ["${KOPIE}/export/zu-gross.nsbmd"]}
      parts: [model]
    - {expect: {error: "61440"}}
  # ... and the import check reports it as an error, too big
  - - inspect_map_import
    - map: "${area.maps.0.2}"
      source: {files: ["${KOPIE}/export/zu-gross.nsbmd"]}
    - expect:
        - {path: 0.state.kind, equals: error}
        - {path: 0.state.code, equals: model.too-big}
  # the door rule on the arrival, after the import (the import replaced the whole .per); the new
  # map's permissions as the ROM must hold them: map 2's plus the door
  - [set_permission, {index: "${area.maps.0.2}", x: 8, y: 25, kind: 105, collision: 128}]
  - [export_map_part, {map: "${area.maps.0.2}", part: permissions, path: "${KOPIE}/export/neu-mit-tuer.per"}]
  # (4) a new encounter file, a new script file and a new text archive on the new header; every
  # grass slot in all three time columns (morning, day, night; the emulator's clock is not set),
  # rate 100, and every replacement list the game reads in grass (the two radio lists, the swarm),
  # so no slot gives a glitch Pokémon (encounter.empty-slot)
  - [get_header, {id: "${area.header}"}, hdr]
  - [create_encounter_file, {}, enc]
  - [new_script_file, {kind: script}, geber_datei]
  - [create_text_archive, {}, archiv]
  - - set_header
    - id: "${area.header}"
      header: {HGSS: {$base: "${hdr.HGSS}", wild_pokemon: "${enc}", script_file_id: "${geber_datei}", text_archive_id: "${archiv}"}}
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, field: rate, value: 100}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 0, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 0, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 0, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 0, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 1, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 1, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 1, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 1, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 2, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 2, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 2, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 2, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 3, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 3, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 3, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 3, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 4, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 4, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 4, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 4, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 5, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 5, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 5, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 5, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 6, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 6, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 6, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 6, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 7, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 7, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 7, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 7, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 8, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 8, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 8, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 8, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 9, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 9, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 9, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 9, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 10, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 10, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 10, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 10, field: level, value: "${L_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 11, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 11, field: species_morning, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 11, field: species_night, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: grass, slot: 11, field: level, value: "${L_WILD}"}}}]
  # the replacement lists: radio Hoenn and Sinnoh replace slots 2-5, the swarm slots 0 and 1
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: radio_hoenn, slot: 0, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: radio_hoenn, slot: 1, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: radio_sinnoh, slot: 0, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: radio_sinnoh, slot: 1, field: species, value: "${S_WILD}"}}}]
  - [data_edit, {kind: encounter, index: "${enc}", patch: {Encounter: {method: land_swarm, field: species, value: "${S_WILD}"}}}]
  - - run_checks
    - {scope: full}
    - expect:
        - {path: groups.length, equals: 3}
        - {path: findings.length, equals: 0}
  # (5) two trainers: without a party each is a finding, with one Pokémon none
  - [create_trainer, {class: 9, name: Jens}, trainer1]
  - [create_trainer, {class: 9, name: Mia}, trainer2]
  - - run_checks
    - {scope: full}
    - expect:
        - {path: groups.length, equals: 3}
        - {path: "findings[code=trainer.no-party].length", equals: 2}
        - {path: findings.length, equals: 2}
  - - data_edit
    - kind: trainer
      index: "${trainer1.id}"
      patch: {TrainerParty: {party: [{iv_or_difficulty: 0, byte1: 0, level: "${L_T1}", species: "${S_T1}", form: 0, item: null, moves: null, ball_capsule: 0, gender: 0, ability: 0}]}}
  - - data_edit
    - kind: trainer
      index: "${trainer2.id}"
      patch: {TrainerParty: {party: [{iv_or_difficulty: 0, byte1: 0, level: "${L_T2}", species: "${S_T2}", form: 0, item: null, moves: null, ball_capsule: 0, gender: 0, ability: 0}]}}
  # battle texts (before the battle ends on \r: the box waits)
  - - set_trainer_texts
    - trainer: "${trainer1.id}"
      texts: [{kind: 0, text: 'Halt! Ich bin Jens!\r'}, {kind: 1, text: 'Du bist stark!'}, {kind: 2, text: 'Gut gekämpft.'}]
  - - set_trainer_texts
    - trainer: "${trainer2.id}"
      texts: [{kind: 0, text: 'Ich bin Mia, kämpf mit mir!\r'}, {kind: 1, text: 'Oh nein!'}, {kind: 2, text: 'Weiter so.'}]
  - - run_checks
    - {scope: full}
    - expect:
        - {path: groups.length, equals: 3}
        - {path: findings.length, equals: 0}
  # (6) the new header's text archive: message 0 changed, one appended (index 1) with a line too wide
  # for the text window (216 px); `wrap` breaks it
  - [edit_text_archive, {index: "${archiv}", edit: {Set: {index: 0, text: 'Willkommen auf dem kleinen Hack!'}}}]
  - [edit_text_archive, {index: "${archiv}", edit: Append}]
  - [edit_text_archive, {index: "${archiv}", edit: {Set: {index: 1, text: 'Diese Zeile ist viel zu lang für das Textfenster des Spiels und muss umbrochen werden.'}}}]
  - - run_checks
    - {scope: full}
    - expect:
        - {path: groups.length, equals: 3}
        - {path: "findings[code=text.too-wide].length", equals: 1}
        - {path: findings.length, equals: 1}
        - {path: findings.0.code, equals: text.too-wide}
      as: r_text
  - [apply_fix, {finding: "${r_text.findings.0}", fix: wrap}, {expect: {path: remaining, equals: false}}]
  - - run_checks
    - {scope: full}
    - expect:
        - {path: groups.length, equals: 3}
        - {path: findings.length, equals: 0}
  # (7) the neighbour with script 3, which the new script file lacks: create_script makes it
  - - add_event
    - eventFile: "${area.event_file}"
      kind: object
      x: 7
      z: 26
      patch: {graphics_id: 317, movement_type: 15, dir: 1, script: 3, trainer_type: 0, sight: 0}
  - - run_checks
    - {scope: full}
    - expect:
        - {path: groups.length, equals: 3}
        - {path: "findings[code=event.script-missing].length", equals: 1}
        - {path: findings.length, equals: 1}
        - {path: findings.0.code, equals: event.script-missing}
      as: r_script
  - [apply_fix, {finding: "${r_script.findings.0}", fix: create_script}, {expect: {path: remaining, equals: false}}]
  # (8) the trainers and the gift on the new place (graphics 333: hiker, as Wanderer Tom on Route 33;
  # movement 14 looks north)
  - - add_event
    - eventFile: "${area.event_file}"
      kind: object
      x: 24
      z: 26
      patch: {graphics_id: 333, movement_type: 14, dir: 0, script: "${trainer1.id+2999}", trainer_type: 1, sight: 3}
  - - add_event
    - eventFile: "${area.event_file}"
      kind: object
      x: 27
      z: 24
      patch: {graphics_id: 333, movement_type: 14, dir: 0, script: "${trainer2.id+2999}", trainer_type: 1, sight: 3}
  - - add_event
    - eventFile: "${area.event_file}"
      kind: object
      x: 6
      z: 25
      patch: {graphics_id: 317, movement_type: 15, dir: 1, script: 2, trainer_type: 0, sight: 0}
  # a text literal needs a saved header that uses the script file (it goes to the header's archive);
  # script 3 replaces the one create_script made: a Potion once by a flag, another text afterwards
  # (FLAG_UNK_0B2: no vanilla script uses it, like FLAG_UNK_0A1 of the gift)
  - [save, {}]
  - - save_script
    - file: "${geber_datei}"
      text: |
        script Main #1:
            End

        script Geber #2:
            LockAll
            FacePlayer
            GoToIfSet FLAG_UNK_0A1, label_given
            NPCMsg "Hier, nimm das."
            WaitButton
            CloseMsg
            GiveMon ${S_GIFT}, 100, 0, 0, 0, VAR_SPECIAL_RESULT
            SetFlag FLAG_UNK_0A1
            ReleaseAll
            End

        label_given:
            ReleaseAll
            End

        script Nachbar #3:
            LockAll
            FacePlayer
            GoToIfSet FLAG_UNK_0B2, label_trank_gegeben
            NPCMsg "Ein Trank für deinen Weg!"
            WaitButton
            CloseMsg
            GiveItem 17, 1, VAR_SPECIAL_RESULT
            SetFlag FLAG_UNK_0B2
            ReleaseAll
            End

        label_trank_gegeben:
            NPCMsg "Schöner Weg, nicht?"
            WaitButton
            CloseMsg
            ReleaseAll
            End
  # (9) nothing left (save and build follow from `build`)
  - - run_checks
    - {scope: full}
    - expect:
        - {path: groups.length, equals: 3}
        - {path: "findings[severity=error].length", equals: 0}
        - {path: "findings[severity=warning].length", equals: 0}
        - {path: findings.length, equals: 0}
build: out.nds
check:
  # the ROM holds map 2's model (the import reached the ROM) and the permissions the studio
  # exported after the door; the new encounter file
  - [g4k, check-data, out.nds,
     --expect, "map:${area.maps.0.2}:model_sha1=${sha1-of:export/karte2.nsbmd}",
     --expect, "map:${area.maps.0.2}:per_sha1=${sha1-of:export/neu-mit-tuer.per}",
     --expect, "encounter:${enc}:grass_rate=100",
     --expect, "encounter:${enc}:grass0=${S_WILD}",
     --expect, "encounter:${enc}:grass11_morning=${S_WILD}",
     --expect, "encounter:${enc}:grass11_night=${S_WILD}",
     --expect, "encounter:${enc}:grass11_level=${L_WILD}"]
play:
  - continue
  - expect-map 64
  - walk left 1
  - walk down 1
  - expect-map ${area.header}
  - wait 150
  - where
  - shot ankunft
  # the gift: face west, talk, through the text
